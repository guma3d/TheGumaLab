<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GumaTutorDoc - AI Learning Materials</title>
    <meta name="description" content="주제를 입력하면 학습자료와 퀴즈 HTML을 생성하고 저장합니다.">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/static/icons/icon-192x192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css?v=1c0366b">
</head>

<body>
    <div class="glass-container">
        <header>
            <div class="logo">
                <h1>GumaTutorDoc</h1>
            </div>
            <p>Create study notes and quizzes from a topic.</p>
        </header>

        <main>
            <form id="topic-form">
                <div class="input-group">
                    <input type="text" id="topic-input" placeholder="Enter a topic here" required autocomplete="off">
                    <button type="submit" id="submit-btn">
                        <span class="btn-text">Convert</span>
                        <div class="loader" style="display: none;"></div>
                    </button>
                </div>

                <div class="option-strip">
                    <label>
                        <span>Level</span>
                        <select id="grade-select" name="grade">
                            <option value="초3">초3</option>
                            <option value="초1-2">초1-2</option>
                            <option value="초3-4">초3-4</option>
                            <option value="초5-6">초5-6</option>
                            <option value="중등">중등</option>
                            <option value="일반">일반</option>
                        </select>
                    </label>
                    <label>
                        <span>Quiz</span>
                        <select id="quiz-count-select" name="quiz_count">
                            <option value="3">3 questions</option>
                            <option value="5" selected>5 questions</option>
                            <option value="7">7 questions</option>
                        </select>
                    </label>
                </div>
            </form>

            <div id="status-panel" class="status-container hidden" aria-live="polite">
                <div class="progress-wrapper">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
                <div class="status-detail">
                    <span id="status-text">Ready...</span>
                    <span id="progress-percent" class="percent">0%</span>
                </div>
            </div>

            <div id="result-container" class="result-container hidden">
                <h3 class="result-title">Document Created!</h3>
                <p class="result-msg">Your learning material is ready.</p>
                <div id="result-actions" class="result-actions"></div>
            </div>

            <div id="active-section" class="documents-section hidden">
                <h3 class="metric-title">
                    <i class="fa-solid fa-spinner fa-spin"></i>In Progress / Queued
                </h3>
                <div id="active-list" class="active-tasks-list"></div>
            </div>

            <div id="history-section" class="documents-section">
                <h3 class="metric-title with-action">
                    <span><i class="fa-solid fa-clock-rotate-left"></i>Completed Documents</span>
                    <i class="fa-solid fa-magnifying-glass" id="open-search-modal-btn" title="Search Documents"></i>
                </h3>
                <div id="tasks-list" class="tasks-grid"></div>
            </div>
        </main>
    </div>

    <div id="search-modal" class="search-modal">
        <div class="search-dialog">
            <div class="search-head">
                <h3><i class="fa-solid fa-magnifying-glass"></i>Search Documents</h3>
                <i class="fa-solid fa-xmark" id="close-search-modal-btn"></i>
            </div>
            <div class="search-body">
                <input type="text" id="search-input" placeholder="Enter title or keywords...">
                <button id="document-search-btn" type="button">Search</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=1c0366b"></script>
</body>

</html>
