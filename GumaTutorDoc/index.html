<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GumaTutorDoc</title>
  <meta name="description" content="주제를 입력하면 학습자료와 퀴즈 HTML을 생성하고 저장합니다.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>GumaTutorDoc</h1>
        <p>주제형 학습자료 생성기</p>
      </div>
      <a class="nav-link" href="#history-section">저장 문서</a>
    </header>

    <main>
      <section class="workspace" aria-labelledby="create-title">
        <div class="create-pane">
          <h2 id="create-title">새 학습자료</h2>
          <form id="topic-form">
            <label for="topic-input">주제</label>
            <div class="input-row">
              <input id="topic-input" name="topic" type="text" placeholder="예: 화산, 세종대왕, 분수의 나눗셈" autocomplete="off" required>
              <button id="submit-btn" type="submit">
                <span class="btn-icon" aria-hidden="true">+</span>
                <span class="btn-text">생성</span>
              </button>
            </div>

            <div class="options-row">
              <label>
                대상
                <select id="grade-select" name="grade">
                  <option value="초3">초3</option>
                  <option value="초1-2">초1-2</option>
                  <option value="초3-4">초3-4</option>
                  <option value="초5-6">초5-6</option>
                  <option value="중등">중등</option>
                  <option value="일반">일반</option>
                </select>
              </label>
              <label>
                퀴즈
                <select id="quiz-count-select" name="quiz_count">
                  <option value="3">3문제</option>
                  <option value="5" selected>5문제</option>
                  <option value="7">7문제</option>
                </select>
              </label>
            </div>
          </form>
        </div>

        <div id="status-panel" class="status-pane hidden" aria-live="polite">
          <div class="status-head">
            <span id="status-topic">처리 중</span>
            <span id="progress-percent">0%</span>
          </div>
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <p id="status-text">대기 중...</p>
          <div id="result-actions" class="result-actions hidden"></div>
        </div>
      </section>

      <section id="active-section" class="list-section hidden">
        <div class="section-head">
          <h2>진행 중</h2>
        </div>
        <div id="active-list" class="task-list"></div>
      </section>

      <section id="history-section" class="list-section">
        <div class="section-head">
          <h2>저장 문서</h2>
          <input id="search-input" type="search" placeholder="문서 검색">
        </div>
        <div id="tasks-list" class="task-list"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
