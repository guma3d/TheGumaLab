<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GumaPhoto - AI Family Semantic Search</title>
    <meta name="description" content="AI-powered semantic search for family photos.">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/style.css?v=13">
</head>

<body>

    <div class="main-layout">
        <header class="top-header">
            <div class="logo">
                <h1 style="font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px;">GumaPhoto</h1>
            </div>
            
            <form id="search-form" class="search-form">
                <div class="input-group">
                    <input type="text" id="search-query" placeholder="Ask anything... (e.g. 'Mom in the rain')" required autocomplete="off">
                    <span id="clear-btn" class="clear-btn hidden" title="Clear search"><i class="fa-solid fa-circle-xmark"></i></span>
                    <button type="submit" id="submit-btn">
                        <span class="btn-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <div class="loader" style="display: none;"></div>
                    </button>
                </div>
            </form>
            <div class="header-actions">
                <input type="file" id="upload-input" multiple accept="image/*" style="display: none;">
                <label for="upload-input" id="upload-btn" class="secondary-btn" title="Upload Photos">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </label>
                <button id="progress-monitor-btn" class="secondary-btn" title="Live Progress Monitor">
                    <i class="fa-solid fa-list-check"></i>
                </button>
            </div>
        </header>
        
        <!-- Upload Progress (Hidden by default) -->
        <div id="upload-progress-container" class="hidden">
            <div class="progress-info">
                <span id="progress-text">0 / 0 uploaded</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-bar-fill" class="progress-bar-fill"></div>
            </div>
        </div>

        <main class="gallery-main">
            
            <!-- Timeline Header (Now a Slider Header at the VERY TOP) -->
            <div id="timeline-header" class="theme-section hidden" style="margin-bottom: 5px;">
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 10px; margin-bottom: 8px; max-width: 100%; overflow: hidden;">
                    <h3 class="theme-title" style="margin: 0; padding: 0; flex-shrink: 0;">Gallery</h3>
                    <div class="gallery-tags" style="display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; background: rgba(30, 30, 38, 0.4); padding: 4px; border-radius: 16px; margin-left: auto;">
                        <button class="tag-btn tag-active" data-tag="recent">Recent</button>
                        <button class="tag-btn" data-tag="성욱">성욱</button>
                        <button class="tag-btn" data-tag="준우">준우</button>
                        <button class="tag-btn" data-tag="지우">지우</button>
                        <button class="tag-btn" data-tag="송이">송이</button>
                    </div>
                </div>
            </div>

            <!-- Gallery Slider Content (Now directly under header) -->
            <div id="gallery-grid" class="theme-scroll-box" style="padding-bottom: 4px;">
                <!-- Image cards will be injected here via JS -->
            </div>

            <!-- Results Metadata -->
            <div id="search-meta" class="search-meta hidden">
                <p id="meta-text"></p>
            </div>

            <!-- Themes Container (Now BELOW the main gallery) -->
            <div id="themes-container" class="themes-container hidden"></div>

        </main>
    </div>

    <!-- Floating Action Bar (FAB) for Download -->
    <div id="selection-fab" class="selection-fab hidden">
        <div class="fab-content">
            <span id="selection-count">0 Selected</span>
            <button id="download-btn" class="download-btn">
                <i class="fa-solid fa-download"></i> Download
            </button>
            <button id="cancel-selection-btn" class="cancel-btn">Cancel</button>
        </div>
    </div>

    <!-- Photo Detail Modal -->
    <div id="photo-modal" class="modal hidden">
        <div class="modal-content">
            <span id="modal-close" class="modal-close">&times;</span>
            <div class="modal-image-container">
                <img id="modal-image" src="" alt="Full View">
            </div>
            <div class="modal-actions">
                <button id="modal-download-btn" class="action-btn" title="Download"><i class="fa-solid fa-download"></i></button>
                <button id="modal-feedback-btn" class="action-btn" title="Feedback"><i class="fa-regular fa-comment-dots"></i></button>
                <button id="modal-delete-btn" class="action-btn danger" title="Delete"><i class="fa-regular fa-trash-can"></i></button>
            </div>
            <div id="feedback-container" class="feedback-container hidden">
                <form id="feedback-form">
                    <input type="text" id="feedback-input" placeholder="e.g. This is Sung-wook, not Song-i." required autocomplete="off">
                    <button type="submit" id="feedback-submit-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
                <div id="feedback-status" class="feedback-status hidden"></div>
            </div>
        </div>
    </div>

    <!-- Live Progress Monitor Modal -->
    <div id="progress-modal" class="modal hidden">
        <div class="modal-content" style="background: rgba(20, 20, 25, 0.98); width: 90%; max-width: 320px; margin: auto; box-sizing: border-box; padding: 1.5rem; border-radius: 10px; border: 2px solid #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);">
            <span id="progress-modal-close" class="modal-close">&times;</span>
            <h2 style="font-size: 1.2rem; color: white; display:flex; align-items:center; gap: 8px; margin-bottom: 1.5rem;">
                <i class="fa-solid fa-server" style="color: #3b82f6;"></i> Live Monitoring
            </h2>
            
            <div style="display:flex; flex-direction: column; gap: 8px;">
                <div style="background: var(--surface-light); padding: 12px; border-radius: 6px;">
                    <h3 style="color:var(--text-muted); font-size: 0.8em; margin-bottom: 3px;">Total Server Photos</h3>
                    <p id="prog-total" style="color:#3b82f6; font-size: 1.2em; font-weight:bold;">Loading...</p>
                    <small style="font-size: 0.75em;">Total pure image files stored in server</small>
                </div>
                
                <div style="background: var(--surface-light); padding: 12px; border-radius: 6px;">
                    <h3 style="color:var(--text-muted); font-size: 0.8em; margin-bottom: 3px;">Pending DB Generation</h3>
                    <p id="prog-ai-left" style="color:#ef4444; font-size: 1.2em; font-weight:bold;">Loading...</p>
                    <small style="font-size: 0.75em;">Images waiting for AI vector indexing</small>
                </div>
                
                <div style="background: var(--surface-light); padding: 12px; border-radius: 6px;">
                    <h3 style="color:var(--text-muted); font-size: 0.8em; margin-bottom: 3px;">Completed Photos</h3>
                    <p id="prog-db" style="color:#10b981; font-size: 1.2em; font-weight:bold;">Loading...</p>
                    <small style="font-size: 0.75em;">Photos fully analyzed and searchable</small>
                </div>
                
                <p id="prog-status" style="font-size: 0.75em; color: var(--text-muted); text-align:right; margin-top: 8px;">
                    Syncing... <i class="fa-solid fa-spinner fa-spin"></i>
                </p>
            </div>
        </div>
    </div>

    <script src="static/script.js?v=22"></script>
</body>

</html>
