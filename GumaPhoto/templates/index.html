<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GumaPhoto - AI Family Semantic Search</title>
    <meta name="description" content="AI-powered semantic search for family photos.">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/style.css?v=11">
</head>

<body>

    <div class="main-layout">
        <header class="top-header">
            <div class="logo">
                <h1>GumaPhoto</h1>
                <p>AI Private Gallery</p>
            </div>
            
            <form id="search-form" class="search-form">
                <div class="input-group">
                    <input type="text" id="search-query" placeholder="Ask anything... ('비 오는 날 엄마 사진')" required autocomplete="off">
                    <span id="clear-btn" class="clear-btn hidden" title="Clear search"><i class="fa-solid fa-circle-xmark"></i></span>
                    <button type="submit" id="submit-btn">
                        <span class="btn-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <div class="loader" style="display: none;"></div>
                    </button>
                </div>
            </form>
            <div class="header-actions">
                <button id="progress-monitor-btn" class="secondary-btn" title="Live Progress Monitor">
                    <i class="fa-solid fa-list-check"></i>
                </button>
                <input type="file" id="upload-input" multiple accept="image/*" style="display: none;">
                <label for="upload-input" id="upload-btn" class="secondary-btn" title="Upload Photos">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </label>
            </div>
        </header>
        
        <!-- Upload Progress (Hidden by default) -->
        <div id="upload-progress-container" class="hidden">
            <div class="progress-info">
                <span id="progress-text">0 / 0 uploaded</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-bar-fill" class="progress-bar-fill"></div>
            </div>
        </div>

        <main class="gallery-main">
            <!-- Results Metadata -->
            <div id="search-meta" class="search-meta hidden">
                <p id="meta-text"></p>
            </div>

            <!-- Gallery Grid -->
            <div id="gallery-grid" class="gallery-grid">
                <!-- Image cards will be injected here via JS -->
            </div>
        </main>
    </div>

    <!-- Floating Action Bar (FAB) for Download -->
    <div id="selection-fab" class="selection-fab hidden">
        <div class="fab-content">
            <span id="selection-count">0 Selected</span>
            <button id="download-btn" class="download-btn">
                <i class="fa-solid fa-download"></i> Download
            </button>
            <button id="cancel-selection-btn" class="cancel-btn">Cancel</button>
        </div>
    </div>

    <!-- Photo Detail Modal -->
    <div id="photo-modal" class="modal hidden">
        <div class="modal-content">
            <span id="modal-close" class="modal-close">&times;</span>
            <div class="modal-image-container">
                <img id="modal-image" src="" alt="Full View">
            </div>
            <div class="modal-actions">
                <button id="modal-download-btn" class="action-btn" title="Download"><i class="fa-solid fa-download"></i></button>
                <button id="modal-feedback-btn" class="action-btn" title="Feedback"><i class="fa-regular fa-comment-dots"></i></button>
                <button id="modal-delete-btn" class="action-btn danger" title="Delete"><i class="fa-regular fa-trash-can"></i></button>
            </div>
            <div id="feedback-container" class="feedback-container hidden">
                <form id="feedback-form">
                    <input type="text" id="feedback-input" placeholder="e.g. This is Sung-wook, not Song-i." required autocomplete="off">
                    <button type="submit" id="feedback-submit-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
                <div id="feedback-status" class="feedback-status hidden"></div>
            </div>
        </div>
    </div>

    <!-- Live Progress Monitor Modal -->
    <div id="progress-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 500px; padding: 2rem; border-radius: 12px;">
            <span id="progress-modal-close" class="modal-close">&times;</span>
            <h2 style="font-size: 1.5rem; color: white; display:flex; align-items:center; gap: 10px; margin-bottom: 2rem;">
                <i class="fa-solid fa-server" style="color: #3b82f6;"></i> 서브서버 실시간 현황 모니터
            </h2>
            
            <div style="display:flex; flex-direction: column; gap: 15px;">
                <div style="background: var(--surface-light); padding: 15px; border-radius: 8px;">
                    <h3 style="color:var(--text-muted); font-size: 0.9em; margin-bottom: 5px;">📦 대기열 (아직 처리 안 됨)</h3>
                    <p id="prog-raw" style="color:#ef4444; font-size: 1.4em; font-weight:bold;">Loading...</p>
                    <small>uploads_raw 폴더에 남아있는 원본 파일</small>
                </div>
                
                <div style="background: var(--surface-light); padding: 15px; border-radius: 8px;">
                    <h3 style="color:var(--text-muted); font-size: 0.9em; margin-bottom: 5px;">🚚 사진 분류 로봇 (폴더 이사)</h3>
                    <p id="prog-org" style="color:#f59e0b; font-size: 1.4em; font-weight:bold;">Loading...</p>
                    <small>날짜/장소 식별 후 하드디스크 최종 정리 완료</small>
                </div>
                
                <div style="background: var(--surface-light); padding: 15px; border-radius: 8px;">
                    <h3 style="color:var(--text-muted); font-size: 0.9em; margin-bottom: 5px;">🤖 딥러닝 스캐너 로봇 (AI)</h3>
                    <p id="prog-ai" style="color:#10b981; font-size: 1.4em; font-weight:bold;">Loading...</p>
                    <small>검색 엔진 (얼굴/배경) 두뇌 DB 이식 완료</small>
                </div>
                
                <p id="prog-status" style="font-size: 0.85em; color: var(--text-muted); text-align:right; margin-top: 10px;">
                    실시간 동기화 중... <i class="fa-solid fa-spinner fa-spin"></i>
                </p>
            </div>
        </div>
    </div>

    <script src="static/script.js?v=12"></script>
</body>

</html>
