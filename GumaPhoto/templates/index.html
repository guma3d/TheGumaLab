<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GumaPhoto - AI Family Search</title>
    <meta name="description" content="AI-powered semantic search for family photos.">
    <link rel="apple-touch-icon" href="frontend/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="frontend/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

    <link rel="stylesheet" href="frontend/style.css?v=150">
</head>

<body>
    <!-- Splash Screen -->
    <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #000; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease-out;">
        <img src="frontend/apple-touch-icon.png" alt="GumaPhoto" style="width: 80px; height: 80px; animation: spin 2.5s linear infinite; border-radius: 50%; box-shadow: 0 0 40px rgba(16, 185, 129, 0.6); border: 2px solid rgba(255, 255, 255, 0.1); margin-bottom: 8px;">
        <h1 style="color: white; font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 700; margin: 16px 0 0 0; letter-spacing: 1px;">Guma<span style="color: #10b981">Photo</span></h1>
    </div>

    <div class="main-layout">
        <!-- Header -->
        <header class="top-header">
            <div class="logo" style="display: flex; align-items: center; cursor: pointer; flex-shrink: 0;" onclick="location.reload();" title="Home">
                <i class="fa-solid fa-camera-retro" style="color: #10b981; margin-right: 10px; font-size: 1.4rem;"></i>
                <h1 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; margin: 0; line-height: 1;">GumaPhoto</h1>
            </div>

            <div class="header-actions" style="display: flex; align-items: center; gap: 8px;">
                <input type="file" id="upload-input" multiple accept="image/*" style="display: none;">
                <label for="upload-input" id="upload-btn" class="secondary-btn" title="Upload Photos">
                    <i class="fa-solid fa-cloud-arrow-up" style="color: white;"></i>
                </label>
                <button id="nav-feedback-btn" class="secondary-btn" title="Feedback">
                    <i class="fa-solid fa-graduation-cap"></i>
                </button>
                <button id="nav-system-btn" class="secondary-btn" title="System">
                    <i class="fa-solid fa-server"></i>
                </button>
            </div>
        </header>

        <!-- Search Bar (always visible) -->
        <div class="search-bar-wrapper">
            <form id="search-form" class="search-bar-form">
                <div class="search-bar-inner">
                    <i class="fa-solid fa-magnifying-glass search-bar-icon"></i>
                    <input type="text" id="search-query" placeholder="사진을 검색하세요... (예: 준우 제주도 여름)" autocomplete="off">
                    <span id="clear-btn" class="clear-btn hidden" title="Clear">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </span>
                </div>
            </form>
        </div>

        <!-- Upload Progress -->
        <div id="upload-progress-container" class="hidden">
            <div class="progress-info">
                <span id="progress-text">0 / 0 uploaded</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-bar-fill" class="progress-bar-fill"></div>
            </div>
        </div>

        <main class="gallery-main">

            <!-- Home Tab -->
            <div id="home">
                <!-- Gallery Grid (최신 사진) -->
                <div id="gallery-grid" class="gallery-grid" style="padding: 0 10px 4px 10px; margin-bottom: 25px;"></div>

                <!-- Search Results Meta -->
                <div id="search-meta" class="search-meta hidden">
                    <p id="meta-text"></p>
                </div>

                <!-- Search Results Grid -->
                <div id="search-grid" class="gallery-grid hidden" style="margin-top: 10px;"></div>
            </div>

            <!-- Feedback Tab -->
            <div id="feedback" class="hidden" style="max-width: 500px; margin: 0 auto; box-sizing: border-box; padding: 0.5rem 1rem 1rem 1rem;">
                <div id="fb-unknown-photo-container" style="display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 100%; box-sizing: border-box;">

                    <div style="width: 100%; max-width: 260px; aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden; background: rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; position: relative; box-shadow: 0 8px 30px rgba(0,0,0,0.6);">
                        <img id="fb-target-img" src="" alt="Unknown Photo" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                        <span id="fb-loading-spinner" style="font-size: 2.5rem; color: #10b981; position: absolute;"><i class="fa-solid fa-spinner fa-spin"></i></span>
                        <div id="fb-info-badges" class="info-badges-overlay"></div>
                    </div>

                    <div id="fb-target-issue" style="padding: 8px 12px; font-weight: 600; font-size: 0.95rem; margin-top: -5px; opacity: 0; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center;">
                        <span style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 6px 12px; border-radius: 8px;"><i class="fa-solid fa-circle-exclamation"></i> Location</span>
                    </div>

                    <div id="fb-single-input-area" style="width: 94%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; position: relative;">
                        <div style="width: 100%; position: relative;">
                            <input type="text" id="fb-input-val" placeholder="정답을 입력하세요 (예: 하남 위례롯데캐슬)" style="padding: 16px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: white; font-size: 16px; width: 100%; box-sizing: border-box;" autocomplete="off">
                            <div id="fb-autocomplete-dropdown" style="display: none; background: #2d3748; border: 1px solid #4a5568; border-radius: 8px; width: 100%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); max-height: 250px; overflow-y: auto; margin-top: 8px; margin-bottom: 4px;"></div>
                        </div>
                        <input type="month" id="fb-input-date" style="padding: 16px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: white; font-size: 16px; width: 100%; max-width: 100%; box-sizing: border-box; display: none; -webkit-appearance: none; appearance: none; min-width: 0;" autocomplete="off">

                        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 8px; width: 100%;">
                            <button id="fb-submit-btn" style="width: 100%; padding: 11px; font-weight: 700; background: linear-gradient(135deg, #10b981, #059669); border: none; font-size: 1.15rem; border-radius: 12px; color: #ffffff; cursor: pointer; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);">Send</button>
                            <button id="fb-no-learning-btn" style="display: none; width: 100%; padding: 11px; font-weight: 700; background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); font-size: 1.05rem; border-radius: 12px; color: #38bdf8; cursor: pointer;">Send But NoFeedback</button>

                            <div style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
                                <div style="display: flex; gap: 10px; width: 100%;">
                                    <button id="fb-skip-btn" style="flex: 1; padding: 9.5px; font-weight: 600; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); font-size: 1rem; border-radius: 12px; color: #f59e0b; cursor: pointer;">
                                        <i class="fa-solid fa-forward-step" style="margin-right: 4px;"></i> Skip
                                    </button>
                                    <button id="fb-remove-btn" style="flex: 1; padding: 9.5px; font-weight: 600; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); font-size: 1rem; border-radius: 12px; color: #ef4444; cursor: pointer;">
                                        <i class="fa-solid fa-trash-can" style="margin-right: 4px;"></i> Remove
                                    </button>
                                </div>
                                <div id="fb-person-feedback-buttons" style="display: none; flex-direction: row; gap: 8px; width: 100%;">
                                    <button id="fb-not-a-face-btn" style="flex: 1; padding: 10px 4px; font-weight: 600; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); font-size: 0.8rem; border-radius: 12px; color: white; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3;">Unidentifiable Person</button>
                                    <button id="fb-no-person-btn" style="flex: 1; padding: 10px 4px; font-weight: 600; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); font-size: 0.9rem; border-radius: 12px; color: white; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3;">No People</button>
                                </div>
                                <p id="fb-people-guide" style="display: none; color: #9ca3af; font-size: 0.85rem; text-align: center; margin: 6px 0 0 0; line-height: 1.5; padding: 0 5px;">
                                    <b style="color:white;">Unidentifiable Person</b> = Back Of head<br><b style="color:white;">No People</b> = Doll, Poster
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- System Tab -->
            <div id="system" class="hidden" style="max-width: 600px; margin: 0 auto; box-sizing: border-box; padding: 1.5rem 1rem 2.5rem 1rem;">
                <div style="display: flex; flex-direction: column; gap: 16px;">
                    <div onclick="window.showStatsModal('photo')" style="background: rgba(30,30,35,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; cursor: pointer;">
                        <h3 style="color: white; font-size: 1.1rem; margin: 0 0 10px 0; font-weight: 600;"><i class="fa-solid fa-images" style="color:#3b82f6"></i> 사진 통계</h3>
                        <p style="color: #9ca3af; margin: 0; font-size: 0.95rem;">전체 보유 사진 수: <strong id="stat-total-photos" style="color: white; font-size: 1.4rem;">-</strong> 장</p>
                    </div>
                    <div onclick="window.showStatsModal('person')" style="background: rgba(30,30,35,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; cursor: pointer;">
                        <h3 style="color: white; font-size: 1.1rem; margin: 0 0 10px 0; font-weight: 600;"><i class="fa-solid fa-users" style="color:#10b981"></i> 인물 통계</h3>
                        <p style="color: #9ca3af; margin: 0; font-size: 0.95rem;">등록 완료된 인물 수: <strong id="stat-total-people" style="color: white; font-size: 1.4rem;">-</strong> 명</p>
                    </div>
                    <div onclick="window.showStatsModal('location')" style="background: rgba(30,30,35,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; cursor: pointer;">
                        <h3 style="color: white; font-size: 1.1rem; margin: 0 0 10px 0; font-weight: 600;"><i class="fa-solid fa-location-dot" style="color:#eab308"></i> 장소 통계</h3>
                        <p style="color: #9ca3af; margin: 0; font-size: 0.95rem;">고유 장소 개수: <strong id="stat-total-locations" style="color: white; font-size: 1.4rem;">-</strong> 곳</p>
                    </div>
                    <div onclick="window.showStatsModal('date')" style="background: rgba(30,30,35,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; cursor: pointer;">
                        <h3 style="color: white; font-size: 1.1rem; margin: 0 0 10px 0; font-weight: 600;"><i class="fa-regular fa-calendar-check" style="color:#f43f5e"></i> 연도 통계</h3>
                        <p style="color: #9ca3af; margin: 0; font-size: 0.95rem;">전체 데이터 수집 기간: <strong id="stat-total-dates" style="color: white; font-size: 1.4rem;">-</strong></p>
                    </div>
                    <div onclick="window.showStatsModal('audit')" style="background: rgba(30,30,35,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; cursor: pointer;">
                        <h3 style="color: white; font-size: 1.1rem; margin: 0 0 10px 0; font-weight: 600;"><i class="fa-solid fa-list-check" style="color:#8b5cf6"></i> 피드백 기록</h3>
                        <p style="color: #9ca3af; margin: 0; font-size: 0.95rem;">최근 메타데이터 수정 내역</p>
                    </div>
                </div>
                <div style="display: flex; justify-content: center; margin-top: 32px; padding-bottom: 40px;">
                    <button onclick="window.fetchAdvancedStats(true)" style="background: rgba(30,30,35,0.4); border: 1px solid rgba(255,255,255,0.08); border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                        <i class="fa-solid fa-rotate-right" id="stats-refresh-icon" style="color: #10b981; font-size: 1.3rem;"></i>
                    </button>
                </div>
            </div>

        </main>
    </div>

    <!-- Stats Detail Modal -->
    <div id="stats-modal" class="modal hidden" style="z-index: 10000; background-color: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; position: fixed; top:0; left:0; width:100%; height:100%;">
        <div class="modal-content" style="max-width: 500px; width: 90vw; background: rgba(20,20,20,0.95); padding: 24px; border-radius: 16px; border: 1px solid var(--glass-border); max-height: 80vh; display: flex; flex-direction: column;">
            <span class="modal-close" style="top: 10px; right: 15px; font-size: 28px;" onclick="document.getElementById('stats-modal').classList.add('hidden'); document.body.style.overflow = 'auto';">&times;</span>
            <h2 id="stats-modal-title" style="color: white; margin-top: 0; margin-bottom: 20px; font-size: 1.3rem;">Detail Statistic</h2>
            <div id="stats-modal-body" style="flex: 1; overflow-y: auto; padding-right: 5px; display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
    </div>

    <!-- Photo Detail Modal -->
    <div id="photo-modal" class="modal hidden">
        <div class="modal-content">
            <span id="modal-close" class="modal-close">&times;</span>
            <div class="modal-image-container" style="position: relative;">
                <img id="modal-image" src="" alt="Full View">
                <div id="modal-info-badges" class="info-badges-overlay"></div>
            </div>
            <div class="modal-info-panel">
                <div class="modal-actions-center" style="gap: 20px;">
                    <button id="modal-manual-feedback-btn" class="action-btn premium-feedback-btn" title="Manual Feedback">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                    <button id="modal-share-btn" class="action-btn premium-share-btn" title="Share Photo">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                    <button id="modal-delete-btn" class="action-btn premium-trash-btn" title="Delete Photo">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div id="delete-confirm-modal" class="modal hidden">
        <div class="modal-content" style="background: rgba(20,20,25,0.98); width: 90%; max-width: 350px; margin: auto; padding: 2.5rem 1.5rem; border-radius: 12px; border: 1px solid rgba(239,68,68,0.3); text-align: center; display: flex; flex-direction: column; align-items: center;">
            <i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; color: #ef4444; margin-bottom: 1.5rem;"></i>
            <h3 style="color: white; font-size: 1.5rem; font-weight: 600; margin-bottom: 2rem;">Really?</h3>
            <div style="display: flex; gap: 12px; width: 100%; justify-content: center;">
                <button id="cancel-delete-btn" style="flex: 1; padding: 11px; border-radius: 8px; border: 1px solid #4b5563; background: #1f242d; color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer;">Cancel</button>
                <button id="confirm-delete-btn" style="flex: 1; padding: 11px; border-radius: 8px; border: 1px solid #4b5563; background: #1f242d; color: #ff6b6b; font-size: 1.1rem; font-weight: 600; cursor: pointer;">Delete</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    <script src="frontend/js_modules/state/store.js?v=2"></script>
    <script src="frontend/js_modules/utils.js?v=2"></script>
    <script src="frontend/js_modules/components/gallery.js?v=2"></script>
    <script src="frontend/js_modules/components/feedback.js?v=8"></script>
    <script src="frontend/js_modules/components/lightbox.js?v=3"></script>
    <script src="frontend/js_modules/components/upload.js?v=2"></script>
    <script type="module" src="frontend/js_modules/api/fetcher.js?v=4"></script>
    <script src="frontend/main.js?v=12"></script>
</body>

</html>
