<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Analyzer - Guma Lab</title>
    <!-- Use FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for consistency -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- PWA / Mobile Optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 
         * Guma Lab - StockMaster_01
         * Premium Dark Theme, Glassmorphism, Neon Accents 
         */
        :root {
            --bg-color: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-bg: rgba(255, 255, 255, 0.07);
            --card-hover-border: rgba(255, 255, 255, 0.2);

            --primary-glow: #10b981;
            /* Indigo */
            --secondary-glow: #34d399;
            /* Pink */
            --accent-color: #10b981;
            /* Cyan */

            --positive-color: #ef4444;
            /* Red (한국: 상승=빨강) */
            --negative-color: #3b82f6;
            /* Blue (한국: 하락=파랑) */

            --text-main: #ffffff;
            --text-muted: #a1a1aa;

            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glows (from Portal) */
        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            opacity: 0.15;
            filter: blur(80px);
            z-index: -1;
            top: -100px;
            left: 10%;
            animation: pulse 10s infinite alternate;
        }

        .ambient-glow-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
            opacity: 0.12;
            filter: blur(80px);
            z-index: -1;
            bottom: -100px;
            right: 15%;
            animation: pulse 8s infinite alternate-reverse;
        }

        .ambient-glow-3 {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--secondary-glow) 0%, transparent 70%);
            opacity: 0.08;
            filter: blur(80px);
            z-index: -1;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation: pulse 12s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.10;
            }

            100% {
                transform: scale(1.1);
                opacity: 0.18;
            }
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 1rem;
            z-index: 1;
        }

        /* Top Header */
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(5, 5, 5, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.2rem;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            cursor: pointer;
        }

        .logo i { color: var(--accent-color); font-size: 1.1rem; }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: var(--card-bg);
            color: var(--text-main);
            border-color: var(--card-border);
        }

        .nav-btn.active {
            background: rgba(16, 185, 129, 0.12);
            color: var(--accent-color);
            border-color: rgba(16, 185, 129, 0.35);
        }

        /* Tab Layout */
        .tab-main {
            width: 100%;
            max-width: 700px;
            padding: 76px 1rem 2rem 1rem;
        }

        .tab-pane { display: none; animation: fadeInUp 0.25s ease-out; }
        .tab-pane.active { display: block; }

        .tab-section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tab-section-title i { color: var(--accent-color); }

        /* Market Indices */
        .market-indices {
            display: flex;
            flex-direction: column;
            margin-bottom: 0.5rem;
            gap: 0.3rem;
        }

        .index-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 0.8rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .index-name {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .index-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .index-change {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .positive .index-change,
        .positive .change {
            color: var(--positive-color);
        }

        .negative .index-change,
        .negative .change {
            color: var(--negative-color);
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        /* Watchlist */
        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stock-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.6rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            transition: background 0.2s ease;
            border: 1px solid transparent;
        }

        .stock-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .stock-info {
            display: flex;
            flex-direction: column;
        }

        .stock-ticker {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .stock-company {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stock-numbers {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stock-numbers .price {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .stock-numbers .change {
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Watchlist Form */
        .watchlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .watchlist-header h2 {
            margin-bottom: 0;
        }

        .btn-add {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-add:hover {
            background: rgba(16, 185, 129, 0.1);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .add-form-container {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: none;
            animation: fadeInDown 0.3s ease-out;
        }

        .add-form-container.active {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .add-form-container input {
            flex: 1;
            min-width: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 0.5rem;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
        }

        .add-form-container input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .add-form-container button {
            background: linear-gradient(90deg, #10b981, #34d399);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }

        .add-form-container button.btn-cancel {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
        }

        .btn-edit {
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.5;
            transition: all 0.2s;
            padding-left: 1rem;
        }

        .btn-edit:hover {
            opacity: 1;
            transform: scale(1.1);
            color: var(--accent-color);
        }

        .btn-remove {
            background: transparent;
            border: none;
            color: var(--negative-color);
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.5;
            transition: all 0.2s;
            padding-left: 0.75rem;
        }

        .btn-remove:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Search Results Dropdown */
        .search-results {
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-top: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .search-results.active {
            display: flex;
        }

        .search-result-item {
            padding: 0.8rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .search-result-name {
            font-weight: 500;
            color: #fff;
        }

        .search-result-ticker {
            font-size: 0.8rem;
            color: var(--accent-color);
            background: rgba(16, 185, 129, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .market-badge {
            font-size: 0.65rem;
            background: var(--accent-color);
            color: #111;
            padding: 0.15rem 0.3rem;
            border-radius: 3px;
            font-weight: 700;
        }

        /* Analysis inner tabs */
        .analysis-inner-tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            overflow-x: auto;
        }
        .analysis-inner-tab {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-muted);
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .analysis-inner-tab:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
        }
        .analysis-inner-tab.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #111;
            font-weight: 700;
        }
        .analysis-pane { display: none; }
        .analysis-pane.active { display: block; animation: fadeInUp 0.2s ease-out; }

        /* AI Panel Markdown Styling */
        .ai-markdown {
            color: var(--text-main);
            font-size: 1.05rem;
        }

        .ai-markdown h3 {
            font-size: 1.3rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .ai-markdown h3:first-child {
            margin-top: 0;
        }

        .ai-markdown p {
            margin-bottom: 1.2rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.85);
        }

        .ai-markdown strong {
            color: #fff;
            background: rgba(16, 185, 129, 0.15); /* Subtle glowing green background */
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-weight: 700;
            border-bottom: 1px solid var(--accent-color);
        }
        
        .ai-markdown em {
            color: var(--secondary-glow);
            font-style: normal;
            font-weight: 500;
        }

        .ai-markdown ul, .ai-markdown ol {
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .ai-markdown li {
            margin-bottom: 0.6rem;
            line-height: 1.6;
        }
        
        .ai-markdown li::marker {
            color: var(--accent-color);
        }

        .ai-markdown blockquote {
            border-left: 4px solid var(--accent-color);
            margin: 1.5rem 0;
            background: rgba(16, 185, 129, 0.05);
            padding: 1rem 1.2rem;
            border-radius: 0 8px 8px 0;
            color: var(--text-main);
            font-style: italic;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Portfolio Tabs */
        .portfolio-tabs {
            display: flex;
            gap: 0.35rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 0.75rem;
            scrollbar-width: none;
        }

        .portfolio-tabs::-webkit-scrollbar {
            display: none;
        }

        .portfolio-tab {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .portfolio-tab:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--text-main);
        }

        .portfolio-tab.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(16, 185, 129, 0.08);
        }

        .portfolio-tab i {
            font-size: 0.8rem;
        }

        /* Screenshot Import Button */
        .btn-import {
            background: transparent;
            border: 1px solid #8b5cf6;
            color: #8b5cf6;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-import:hover {
            background: rgba(139, 92, 246, 0.1);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }

        /* Import Modal Overlay */
        .import-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .import-modal-overlay.active {
            display: flex;
        }

        .import-modal {
            background: #111;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.5rem;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            animation: fadeInUp 0.3s ease-out;
        }

        .import-modal h3 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .import-modal h3 i {
            color: #8b5cf6;
        }

        .import-upload-area {
            border: 2px dashed rgba(139, 92, 246, 0.4);
            border-radius: 16px;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .import-upload-area:hover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.05);
        }

        .import-upload-area.dragover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
        }

        .import-upload-area i {
            font-size: 2.5rem;
            color: #8b5cf6;
            margin-bottom: 0.75rem;
        }

        .import-upload-area p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .import-preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            margin-bottom: 1rem;
            border: 1px solid var(--card-border);
        }

        .import-stock-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .import-stock-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .import-stock-item input[type="checkbox"] {
            accent-color: #8b5cf6;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .import-stock-detail {
            flex: 1;
        }

        .import-stock-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .import-stock-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }

        .import-stock-shares {
            font-weight: 700;
            color: var(--accent-color);
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .import-mode-selector {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .import-mode-btn {
            flex: 1;
            padding: 0.6rem;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .import-mode-btn.selected {
            border-color: #8b5cf6;
            color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
        }

        .import-actions {
            display: flex;
            gap: 0.5rem;
        }

        .import-actions button {
            flex: 1;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .btn-import-confirm {
            background: linear-gradient(90deg, #8b5cf6, #a78bfa);
            color: #fff;
        }

        .btn-import-confirm:hover {
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .btn-import-confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-import-cancel {
            background: transparent;
            border: 1px solid var(--text-muted) !important;
            color: var(--text-muted);
        }

        .import-loading {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
        }

        .import-loading i {
            font-size: 2rem;
            color: #8b5cf6;
            margin-bottom: 0.75rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .tab-main { padding-left: 0.75rem; padding-right: 0.75rem; }
        }
    </style>
</head>

<body>
    <!-- Ambient glowing backgrounds matching the Portal -->
    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>
    <div class="ambient-glow-3"></div>

    <!-- Fixed Header -->
    <header class="top-header">
        <div class="logo" onclick="location.reload()" title="Refresh">
            <i class="fa-solid fa-chart-line"></i>
            <span>Guma<span style="color:var(--accent-color)">Stock</span></span>
        </div>
        <nav class="header-nav">
            <button class="nav-btn active" data-tab="market" title="Market Overview">
                <i class="fa-solid fa-earth-americas"></i>
            </button>
            <button class="nav-btn" data-tab="portfolio" title="My Portfolio">
                <i class="fa-solid fa-chart-pie"></i>
            </button>
            <button class="nav-btn" data-tab="analysis" title="Portfolio Analysis">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
        </nav>
    </header>

    <!-- Tab Content -->
    <main class="tab-main">

        <!-- Tab: Market Overview -->

    <script>
        function formatNumberWithDot(num) {
            if (num === "N/A" || num === "Error") return num;
            let parts = num.toString().split(".");
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            return parts.join(".");
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('StockMaster UI Loaded');

            // ====== Tab Navigation ======
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const target = btn.dataset.tab;
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('tab-' + target).classList.add('active');
                });
            });

            // ====== Analysis Inner Tabs ======
            document.querySelectorAll('.analysis-inner-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.analysis-inner-tab').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.analysis-pane').forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('analysis-pane-' + btn.dataset.atab).classList.add('active');
                });
            });

            // ====== Portfolio State ======
            let currentPortfolioId = 1;
            let portfolioList = [];
            let grandTotalKrw = null;
            let grandTotalUsd = null;

            async function fetchGrandTotal() {
                try {
                    const res = await fetch('/api/portfolio-total');
                    const data = await res.json();
                    grandTotalKrw = Math.round(data.krw);
                    grandTotalUsd = data.usd;
                    updatePortfolioTotalsDisplay();
                } catch (e) {
                    console.error('Failed to fetch grand total', e);
                }
            }

            function updatePortfolioTotalsDisplay() {
                const el = document.getElementById('portfolio-totals');
                const tabKrw = parseInt(el.dataset.tabKrw || '0');
                const tabUsd = parseFloat(el.dataset.tabUsd || '0');
                let lines = [];
                if (grandTotalKrw !== null) {
                    const usdPart = grandTotalUsd > 0 ? ` + $${formatNumberWithDot(grandTotalUsd.toFixed(2))}` : '';
                    lines.push(`<div>전체 &nbsp;₩${formatNumberWithDot(grandTotalKrw)}${usdPart}</div>`);
                }
                const tabUsdPart = tabUsd > 0 ? ` + $${formatNumberWithDot(tabUsd)}` : '';
                lines.push(`<div style="color:var(--text-muted);">현재 탭  ₩${formatNumberWithDot(tabKrw)}${tabUsdPart}</div>`);
                el.innerHTML = lines.join('');
            }

            async function fetchPortfolios() {
                try {
                    const res = await fetch('/api/portfolios');
                    portfolioList = await res.json();
                    renderPortfolioTabs();
                } catch (e) {
                    console.error('Failed to fetch portfolios', e);
                }
            }

            function renderPortfolioTabs() {
                const container = document.getElementById('portfolio-tabs');
                container.innerHTML = '';
                portfolioList.forEach(p => {
                    const tab = document.createElement('button');
                    tab.className = 'portfolio-tab' + (p.id === currentPortfolioId ? ' active' : '');
                    tab.innerHTML = `<i class="fa-solid ${p.icon || 'fa-briefcase'}"></i> ${p.name}`;
                    tab.addEventListener('click', () => switchPortfolio(p.id));
                    container.appendChild(tab);
                });
            }

            function switchPortfolio(id) {
                currentPortfolioId = id;
                renderPortfolioTabs();
                document.getElementById('watchlist-container').innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 1rem;">Loading...</div>';
                fetchWatchlistData();
            }

            fetchPortfolios();

            // Polling data functionality
            async function fetchMarketData() {
                try {
                    const res = await fetch(`/api/market-indices?t=${new Date().getTime()}`);
                    const data = await res.json();

                    const container = document.getElementById('market-indices-container');
                    container.innerHTML = ''; // clear

                    data.forEach(item => {
                        const isUpStr = item.is_up ? 'positive' : 'negative';
                        const signStr = item.is_up ? '+' : '';
                        const iconStr = item.is_up ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down';
                        const changeStr = item.price === "N/A" || item.price === "Error" ? 'N/A' : `${signStr}${item.change}% <i class="fa-solid ${iconStr}"></i>`;
                        const priceStr = item.price === "N/A" || item.price === "Error" ? item.price : `${formatNumberWithDot(item.price)}`;

                        container.innerHTML += `
                            <div class="stock-row" style="padding: 0.4rem 0.6rem;">
                                <div class="stock-info" style="flex: 1;">
                                    <span class="stock-ticker" style="color: var(--text-main); font-size: 1rem;">${item.name}</span>
                                </div>
                                <div style="display: flex; align-items: center;">
                                    <div class="stock-numbers ${isUpStr}" style="flex-direction: row; gap: 0.75rem; align-items: center;">
                                        <span class="price" style="font-size: 1rem;">${priceStr}</span>
                                        <span class="change" style="font-size: 1rem;">${changeStr}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } catch (e) {
                    console.error("Failed to fetch market data", e);
                    const container = document.getElementById('market-indices-container');
                    if (container.innerHTML.includes('Loading')) {
                        container.innerHTML = '<div style="color: var(--text-muted); text-align: center; width: 100%;">데이터 로딩 실패. 재시도 중...</div>';
                    }
                }
            }

            async function fetchWatchlistData() {
                try {
                    const res = await fetch(`/api/watchlist?portfolio_id=${currentPortfolioId}&t=${new Date().getTime()}`);
                    const data = await res.json();

                    const container = document.getElementById('watchlist-container');
                    container.innerHTML = ''; // clear

                    let totalKrw = 0;
                    let totalUsd = 0;

                    data.forEach(item => {
                        const shares = item.shares || 0;

                        if (item.is_cash) {
                            // 현금성 자산 렌더링
                            const balanceStr = item.currency === '₩'
                                ? `${item.currency}${formatNumberWithDot(Math.round(item.total_value))}`
                                : `${item.currency}${Number(item.total_value).toFixed(2)}`;

                            if (item.currency === '₩') totalKrw += item.total_value;
                            else if (item.currency === '$') totalUsd += item.total_value;

                            container.innerHTML += `
                                <div class="stock-row" style="opacity:0.85;">
                                    <div class="stock-info">
                                        <span class="stock-ticker" style="color:var(--text-muted);">
                                            <i class="fa-solid fa-wallet" style="font-size:0.85rem; margin-right:0.3rem;"></i>${item.name}
                                        </span>
                                        <div style="font-size:0.85rem; color:var(--accent-color); margin-top:0.15rem;">잔고: ${balanceStr}</div>
                                    </div>
                                    <div style="display: flex; align-items: center;">
                                        <button class="btn-edit" onclick="editStockShares('${item.raw_ticker}', '${item.name}', ${shares})" title="Edit"><i class="fa-solid fa-pen"></i></button>
                                        <button class="btn-remove" onclick="removeStock('${item.raw_ticker}')" title="Remove"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>`;
                        } else {
                            // 일반 종목 렌더링
                            const isUpStr = item.is_up ? 'positive' : 'negative';
                            const signStr = item.is_up ? '+' : '';
                            const iconStr = item.is_up ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down';
                            const changeStr = item.price === "N/A" || item.price === "Error" ? 'N/A' : `${signStr}${item.change}% <i class="fa-solid ${iconStr}"></i>`;
                            const priceStr = item.price === "N/A" || item.price === "Error" ? item.price : `${item.currency}${formatNumberWithDot(item.price)}`;
                            const totalValStr = shares > 0 && item.total_value ? `<div style="font-size:0.85rem; color:var(--accent-color); margin-top:0.15rem;">보유: ${formatNumberWithDot(Math.round(shares * 10000) / 10000)}주 (${item.currency}${formatNumberWithDot(Math.round(item.total_value))})</div>` : '';

                            if (item.currency === '₩' && item.total_value) totalKrw += item.total_value;
                            else if (item.currency === '$' && item.total_value) totalUsd += item.total_value;

                            container.innerHTML += `
                                <div class="stock-row">
                                    <div class="stock-info">
                                        <span class="stock-ticker">${item.name}</span>
                                        ${totalValStr}
                                    </div>
                                    <div style="display: flex; align-items: center;">
                                        <div class="stock-numbers ${isUpStr}">
                                            <span class="price">${priceStr}</span>
                                            <span class="change">${changeStr}</span>
                                        </div>
                                        <button class="btn-edit" onclick="editStockShares('${item.raw_ticker}', '${item.name}', ${shares})" title="Edit Shares"><i class="fa-solid fa-pen"></i></button>
                                        <button class="btn-remove" onclick="removeStock('${item.raw_ticker}')" title="Remove"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>`;
                        }
                    });

                    document.getElementById('portfolio-totals').dataset.tabKrw = Math.round(totalKrw);
                    document.getElementById('portfolio-totals').dataset.tabUsd = totalUsd.toFixed(2);
                    updatePortfolioTotalsDisplay();
                } catch (e) {
                    console.error("Failed to fetch watchlist data", e);
                }
            }

            function parseAnalysisSections(rawText) {
                const markers = [
                    { key: 'status',    pattern: '[Current Portfolio Status]' },
                    { key: 'news',      pattern: '[Market News & Portfolio Direction]' },
                    { key: 'recommend', pattern: '[Recommended Modifications]' },
                ];
                const positions = markers.map(m => ({
                    key: m.key,
                    idx: rawText.indexOf(m.pattern),
                    len: m.pattern.length,
                })).filter(m => m.idx !== -1).sort((a, b) => a.idx - b.idx);

                const sections = { status: rawText, news: '', recommend: '' };

                if (positions.length > 0) {
                    sections.status    = '';
                    sections.news      = '';
                    sections.recommend = '';
                    for (let i = 0; i < positions.length; i++) {
                        const start = positions[i].idx + positions[i].len;
                        const end   = i + 1 < positions.length ? positions[i + 1].idx : rawText.length;
                        sections[positions[i].key] = rawText.slice(start, end).trim();
                    }
                }
                return sections;
            }

            function renderMarkdown(text) {
                if (!text) return '';
                return typeof marked !== 'undefined' ? marked.parse(text) : text.replace(/\n/g, '<br>');
            }

            async function fetchPortfolioAnalysis() {
                try {
                    const res = await fetch(`/api/portfolio-analysis?t=${new Date().getTime()}`);
                    const data = await res.json();

                    if (data.success) {
                        const sections = parseAnalysisSections(data.analysis);
                        document.getElementById('analysis-content-status').innerHTML    = renderMarkdown(sections.status)    || '<p style="color:var(--text-muted)">분석 데이터 없음</p>';
                        document.getElementById('analysis-content-news').innerHTML      = renderMarkdown(sections.news)      || '<p style="color:var(--text-muted)">분석 데이터 없음</p>';
                        document.getElementById('analysis-content-recommend').innerHTML = renderMarkdown(sections.recommend) || '<p style="color:var(--text-muted)">분석 데이터 없음</p>';
                    } else if (data.error) {
                        const errHtml = `<p style="color: var(--negative-color);">Error: ${data.error}</p>`;
                        ['status', 'news', 'recommend'].forEach(k =>
                            document.getElementById('analysis-content-' + k).innerHTML = errHtml
                        );
                    }
                } catch (e) {
                    console.error("Failed to fetch portfolio analysis", e);
                }
            }

            // Initialization and setup interval
            fetchMarketData();
            fetchWatchlistData();
            fetchPortfolioAnalysis();
            fetchGrandTotal();
            setInterval(() => {
                fetchMarketData();
                fetchWatchlistData();
                fetchPortfolioAnalysis();
                fetchGrandTotal();
            }, 30000); // 30 second refresh

            // Watchlist Add/Remove interactions
            const addForm = document.getElementById('add-form');
            const searchInput = document.getElementById('input-search');
            const searchBtn = document.getElementById('btn-search-stock');
            const searchResultsContainer = document.getElementById('search-results-container');

            document.getElementById('btn-toggle-add').addEventListener('click', () => {
                addForm.classList.toggle('active');
                if (addForm.classList.contains('active')) {
                    searchInput.focus();
                }
            });

            document.getElementById('btn-cancel-add').addEventListener('click', () => {
                addForm.classList.remove('active');
                searchInput.value = '';
                searchResultsContainer.classList.remove('active');
                searchResultsContainer.innerHTML = '';
            });

            searchBtn.addEventListener('click', async () => {
                const query = searchInput.value;
                if (!query) {
                    alert('Please enter a search term.');
                    return;
                }

                searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                searchBtn.disabled = true;
                searchResultsContainer.classList.add('active');
                searchResultsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--text-muted);">Searching with AI...</div>';

                try {
                    const res = await fetch('/api/search-stock', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query })
                    });
                    const data = await res.json();

                    searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Search';
                    searchBtn.disabled = false;

                    if (data.success && data.results.length > 0) {
                        searchResultsContainer.innerHTML = '';
                        data.results.forEach(stock => {
                            const item = document.createElement('div');
                            item.className = 'search-result-item';
                            const marketStr = stock.market ? `<span class="market-badge">${stock.market}</span>` : '';
                            item.innerHTML = `
                                <span class="search-result-name">${stock.name}</span>
                                <span class="search-result-ticker">${marketStr} ${stock.ticker}</span>
                            `;
                            item.addEventListener('click', () => {
                                addStockToWatchlist(stock.ticker, stock.name);
                            });
                            searchResultsContainer.appendChild(item);
                        });
                    } else if (data.success && data.results.length === 0) {
                        searchResultsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--text-muted);">No results found.</div>';
                    } else {
                        searchResultsContainer.innerHTML = `<div style="padding: 1rem; text-align: center; color: var(--negative-color);">Error: ${data.error}</div>`;
                    }
                } catch (e) {
                    console.error("Search API failed", e);
                    searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Search';
                    searchBtn.disabled = false;
                    searchResultsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--negative-color);">Network error occurred.</div>';
                }
            });

            // Allow Enter key to trigger search
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchBtn.click();
                }
            });

            async function addStockToWatchlist(ticker, name) {
                const sharesStr = prompt('Enter quantity:', "1");
                if (sharesStr === null) return;
                const shares = parseFloat(sharesStr) || 1;

                try {
                    searchResultsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--text-muted);">Adding to portfolio...</div>';
                    const res = await fetch('/api/watchlist', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ticker, name, shares, portfolio_id: currentPortfolioId })
                    });
                    const data = await res.json();
                    if (data.success) {
                        addForm.classList.remove('active');
                        searchInput.value = '';
                        searchResultsContainer.classList.remove('active');
                        searchResultsContainer.innerHTML = '';

                        document.getElementById('watchlist-container').innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 1rem;">Updating...</div>';
                        fetchWatchlistData();
                        fetchPortfolioAnalysis(); // Re-analyze on new stock added
                    } else {
                        alert('Error: ' + data.error);
                        searchResultsContainer.innerHTML = '';
                    }
                } catch (e) {
                    console.error("Failed to add stock", e);
                    alert("Failed to add stock.");
                }
            }

            window.editStockShares = async function (rawTicker, name, currentShares) {
                const sharesStr = prompt('Enter quantity:', currentShares);
                if (sharesStr === null) return;
                const shares = parseFloat(sharesStr) || 0;

                try {
                    document.getElementById('watchlist-container').innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 1rem;">Updating...</div>';
                    const res = await fetch('/api/watchlist', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ticker: rawTicker, name: name, shares: shares, portfolio_id: currentPortfolioId })
                    });
                    const data = await res.json();
                    if (data.success) {
                        fetchWatchlistData();
                        fetchPortfolioAnalysis();
                    } else {
                        alert('Error: ' + data.error);
                        fetchWatchlistData();
                    }
                } catch (e) {
                    console.error("Failed to update stock", e);
                    alert("Failed to update stock.");
                    fetchWatchlistData();
                }
            };

            window.removeStock = async function (rawTicker) {
                if (!confirm("Are you sure you want to remove this stock?")) return;

                try {
                    const res = await fetch(`/api/watchlist/${rawTicker}?portfolio_id=${currentPortfolioId}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) {
                        document.getElementById('watchlist-container').innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 1rem;">Updating...</div>';
                        fetchWatchlistData();
                        fetchPortfolioAnalysis(); // Re-analyze after removal
                    }
                } catch (e) {
                    console.error("Failed to remove stock", e);
                }
            };

            // ====== Screenshot Import Logic ======
            const importOverlay = document.getElementById('import-modal-overlay');
            const importFileInput = document.getElementById('import-file-input');
            const importDropZone = document.getElementById('import-drop-zone');
            const stepUpload = document.getElementById('import-step-upload');
            const stepLoading = document.getElementById('import-step-loading');
            const stepResults = document.getElementById('import-step-results');

            let parsedStocks = [];
            let parsedCash = [];
            let importMode = 'replace';

            // Open modal
            document.getElementById('btn-open-import').addEventListener('click', () => {
                importOverlay.classList.add('active');
                resetImportModal();
            });

            // Close modal
            document.getElementById('btn-import-close').addEventListener('click', () => {
                importOverlay.classList.remove('active');
            });

            importOverlay.addEventListener('click', (e) => {
                if (e.target === importOverlay) importOverlay.classList.remove('active');
            });

            // Click drop zone → open file picker
            importDropZone.addEventListener('click', () => importFileInput.click());

            // Drag & drop
            importDropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                importDropZone.classList.add('dragover');
            });
            importDropZone.addEventListener('dragleave', () => importDropZone.classList.remove('dragover'));
            importDropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                importDropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleImportFiles(e.dataTransfer.files);
                }
            });

            // File selected (multiple)
            importFileInput.addEventListener('change', () => {
                if (importFileInput.files.length > 0) {
                    handleImportFiles(importFileInput.files);
                }
            });

            function resetImportModal() {
                stepUpload.style.display = '';
                stepLoading.style.display = 'none';
                stepResults.style.display = 'none';
                importFileInput.value = '';
                parsedStocks = [];
                parsedCash = [];
                importMode = 'replace';
                document.getElementById('mode-replace').classList.add('selected');
                document.getElementById('mode-merge').classList.remove('selected');
            }

            async function handleImportFiles(fileList) {
                const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
                if (files.length === 0) {
                    alert('이미지 파일을 선택해주세요.');
                    return;
                }
                const oversized = files.filter(f => f.size > 16 * 1024 * 1024);
                if (oversized.length > 0) {
                    alert(`파일 크기가 16MB를 초과하는 이미지가 ${oversized.length}개 있습니다.`);
                    return;
                }

                stepUpload.style.display = 'none';
                stepLoading.style.display = '';

                const stockMap = new Map(); // ticker → stock (중복 제거)
                const cashMap  = new Map(); // ticker → cash

                for (let i = 0; i < files.length; i++) {
                    document.getElementById('import-loading-text').textContent =
                        files.length > 1
                            ? `이미지 ${i + 1} / ${files.length} 분석 중...`
                            : 'AI가 스크린샷을 분석하고 있습니다...';

                    const formData = new FormData();
                    formData.append('image', files[i]);

                    try {
                        const res = await fetch('/api/parse-screenshot', { method: 'POST', body: formData });
                        const data = await res.json();
                        if (data.success) {
                            (data.stocks || []).forEach(s => stockMap.set(s.ticker, s));
                            (data.cash  || []).forEach(c => cashMap.set(c.ticker, c));
                        } else {
                            console.warn(`이미지 ${i + 1} 파싱 실패:`, data.error);
                        }
                    } catch (e) {
                        console.error(`이미지 ${i + 1} 처리 오류:`, e);
                    }
                }

                stepLoading.style.display = 'none';

                parsedStocks = Array.from(stockMap.values());
                parsedCash   = Array.from(cashMap.values());

                if (parsedStocks.length === 0 && parsedCash.length === 0) {
                    alert('종목 정보를 찾을 수 없습니다. 삼성증권 보유종목 화면을 캡처해주세요.');
                    resetImportModal();
                    return;
                }

                renderImportResults(files.length);
                stepResults.style.display = '';
            }

            function renderImportResults(imageCount) {
                const list = document.getElementById('import-stock-list');
                const countEl = document.getElementById('import-result-count');
                const imgText = imageCount > 1 ? `이미지 ${imageCount}장에서 ` : '';
                countEl.textContent = `${imgText}종목 ${parsedStocks.length}개 + 현금 ${parsedCash.length}개 감지되었습니다.`;

                list.innerHTML = '';

                // 종목 섹션
                if (parsedStocks.length > 0) {
                    list.innerHTML += `<div style="font-size:0.75rem; color:var(--text-muted); padding:0.25rem 0; margin-top:0.25rem;">📈 보유 종목</div>`;
                    parsedStocks.forEach((stock, idx) => {
                        let marketBadge;
                        if (stock.market === 'US') {
                            marketBadge = '<span style="font-size:0.65rem; background:#3b82f6; color:#fff; padding:0.1rem 0.3rem; border-radius:3px; font-weight:700;">US</span>';
                        } else if (stock.market === 'FUND') {
                            marketBadge = '<span style="font-size:0.65rem; background:#8b5cf6; color:#fff; padding:0.1rem 0.3rem; border-radius:3px; font-weight:700;">FUND</span>';
                        } else {
                            marketBadge = `<span style="font-size:0.65rem; background:var(--accent-color); color:#111; padding:0.1rem 0.3rem; border-radius:3px; font-weight:700;">${stock.market}</span>`;
                        }
                        const valueStr = stock.eval_krw
                            ? '₩' + Number(stock.eval_krw).toLocaleString()
                            : (stock.shares != null ? stock.shares + '주' : '-');
                        list.innerHTML += `
                            <div class="import-stock-item">
                                <input type="checkbox" checked data-type="stock" data-idx="${idx}" class="import-checkbox">
                                <div class="import-stock-detail">
                                    <div class="import-stock-name">${stock.name}</div>
                                    <div class="import-stock-meta">${marketBadge} ${stock.code || ''}</div>
                                </div>
                                <div class="import-stock-shares">${valueStr}</div>
                            </div>`;
                    });
                }

                // 현금 섹션
                if (parsedCash.length > 0) {
                    list.innerHTML += `<div style="font-size:0.75rem; color:var(--text-muted); padding:0.25rem 0; margin-top:0.5rem;">💰 현금성 자산</div>`;
                    const currencySymbols = {'KRW':'₩','USD':'$','EUR':'€','JPY':'¥','GBP':'£'};
                    parsedCash.forEach((item, idx) => {
                        const sym = currencySymbols[item.currency] || item.currency + ' ';
                        const amountStr = item.currency === 'KRW'
                            ? sym + Number(item.amount).toLocaleString()
                            : sym + Number(item.amount).toFixed(2);
                        list.innerHTML += `
                            <div class="import-stock-item">
                                <input type="checkbox" checked data-type="cash" data-idx="${idx}" class="import-checkbox">
                                <div class="import-stock-detail">
                                    <div class="import-stock-name">${item.name}</div>
                                    <div class="import-stock-meta"><span style="font-size:0.65rem; background:#6b7280; color:#fff; padding:0.1rem 0.3rem; border-radius:3px; font-weight:700;">${item.currency}</span></div>
                                </div>
                                <div class="import-stock-shares">${amountStr}</div>
                            </div>`;
                    });
                }
            }

            // Mode selector
            document.getElementById('mode-replace').addEventListener('click', function () {
                importMode = 'replace';
                this.classList.add('selected');
                document.getElementById('mode-merge').classList.remove('selected');
            });
            document.getElementById('mode-merge').addEventListener('click', function () {
                importMode = 'merge';
                this.classList.add('selected');
                document.getElementById('mode-replace').classList.remove('selected');
            });

            // Retry button
            document.getElementById('btn-import-retry').addEventListener('click', () => {
                resetImportModal();
            });

            // Confirm import
            document.getElementById('btn-import-confirm').addEventListener('click', async () => {
                const checkboxes = document.querySelectorAll('.import-checkbox');
                const selectedStocks = [];
                checkboxes.forEach(cb => {
                    if (!cb.checked) return;
                    const idx = parseInt(cb.dataset.idx);
                    if (cb.dataset.type === 'cash') {
                        const item = parsedCash[idx];
                        // 현금 항목을 watchlist 호환 포맷으로 변환
                        selectedStocks.push({
                            ticker: item.ticker,
                            name: item.name,
                            shares: item.amount
                        });
                    } else {
                        selectedStocks.push(parsedStocks[idx]);
                    }
                });

                if (selectedStocks.length === 0) {
                    alert('가져올 항목을 선택해주세요.');
                    return;
                }

                const confirmBtn = document.getElementById('btn-import-confirm');
                confirmBtn.disabled = true;
                confirmBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 처리 중...';

                try {
                    const res = await fetch('/api/import-portfolio', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ stocks: selectedStocks, mode: importMode, portfolio_id: currentPortfolioId })
                    });
                    const data = await res.json();

                    if (data.success) {
                        importOverlay.classList.remove('active');
                        document.getElementById('watchlist-container').innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 1rem;">Updating...</div>';
                        fetchWatchlistData();
                        fetchPortfolioAnalysis();
                        fetchGrandTotal();
                    } else {
                        alert('가져오기 실패: ' + (data.error || '알 수 없는 오류'));
                    }
                } catch (e) {
                    console.error('Import failed', e);
                    alert('가져오기 중 오류가 발생했습니다.');
                } finally {
                    confirmBtn.disabled = false;
                    confirmBtn.innerHTML = '<i class="fa-solid fa-check"></i> 가져오기';
                }
            });
        });

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then((registration) => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, (err) => {
                    console.error('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>

</html>
