<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Analyzer - Guma Lab</title>
    <!-- Use FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for consistency -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- PWA / Mobile Optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 
         * Guma Lab - StockMaster_01
         * Premium Dark Theme, Glassmorphism, Neon Accents 
         */
        :root {
            --bg-color: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-bg: rgba(255, 255, 255, 0.07);
            --card-hover-border: rgba(255, 255, 255, 0.2);

            --primary-glow: #10b981;
            /* Indigo */
            --secondary-glow: #34d399;
            /* Pink */
            --accent-color: #10b981;
            /* Cyan */

            --positive-color: #10b981;
            /* Green */
            --negative-color: #ef4444;
            /* Red */

            --text-main: #ffffff;
            --text-muted: #a1a1aa;

            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 1rem;
        }

        /* Ambient Glows (from Portal) */
        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            opacity: 0.15;
            filter: blur(80px);
            z-index: -1;
            top: -100px;
            left: 10%;
            animation: pulse 10s infinite alternate;
        }

        .ambient-glow-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
            opacity: 0.12;
            filter: blur(80px);
            z-index: -1;
            bottom: -100px;
            right: 15%;
            animation: pulse 8s infinite alternate-reverse;
        }

        .ambient-glow-3 {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--secondary-glow) 0%, transparent 70%);
            opacity: 0.08;
            filter: blur(80px);
            z-index: -1;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            animation: pulse 12s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.10;
            }

            100% {
                transform: scale(1.1);
                opacity: 0.18;
            }
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 1rem;
            z-index: 1;
        }

        /* Header Config */
        header {
            margin-bottom: 1.5rem;
            margin-top: 0.5rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .back-button {
            font-size: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: all var(--transition-speed) ease;
            padding: 0.5rem;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
        }

        .back-button:hover {
            color: var(--accent-color);
            background: var(--card-hover-bg);
            border-color: var(--accent-color);
            transform: scale(1.1) translateX(-3px);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        /* Base Card Style */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.2rem;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out backwards;
            transition: all var(--transition-speed) ease;
        }

        .card:hover {
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
            border-color: var(--card-hover-border);
        }

        .card h2 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card h2 i {
            color: var(--accent-color);
        }

        /* Grid Layout */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.2rem;
        }

        .panel-overview {
            grid-column: span 1;
        }

        .panel-watchlist {
            grid-column: span 1;
        }

        .panel-ai-insight {
            grid-column: span 2;
        }

        /* Market Indices */
        .market-indices {
            display: flex;
            flex-direction: column;
            margin-bottom: 0.5rem;
            gap: 0.3rem;
        }

        .index-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 0.8rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .index-name {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .index-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .index-change {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .positive .index-change,
        .positive .change {
            color: var(--positive-color);
        }

        .negative .index-change,
        .negative .change {
            color: var(--negative-color);
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        /* Watchlist */
        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stock-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.6rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            transition: background 0.2s ease;
            border: 1px solid transparent;
        }

        .stock-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .stock-info {
            display: flex;
            flex-direction: column;
        }

        .stock-ticker {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .stock-company {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stock-numbers {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stock-numbers .price {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .stock-numbers .change {
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Watchlist Form */
        .watchlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .watchlist-header h2 {
            margin-bottom: 0;
        }

        .btn-add {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-add:hover {
            background: rgba(16, 185, 129, 0.1);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .add-form-container {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: none;
            animation: fadeInDown 0.3s ease-out;
        }

        .add-form-container.active {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .add-form-container input {
            flex: 1;
            min-width: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 0.5rem;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
        }

        .add-form-container input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .add-form-container button {
            background: linear-gradient(90deg, #10b981, #34d399);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }

        .add-form-container button.btn-cancel {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
        }

        .btn-edit {
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.5;
            transition: all 0.2s;
            padding-left: 1rem;
        }

        .btn-edit:hover {
            opacity: 1;
            transform: scale(1.1);
            color: var(--accent-color);
        }

        .btn-remove {
            background: transparent;
            border: none;
            color: var(--negative-color);
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.5;
            transition: all 0.2s;
            padding-left: 0.75rem;
        }

        .btn-remove:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Search Results Dropdown */
        .search-results {
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-top: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .search-results.active {
            display: flex;
        }

        .search-result-item {
            padding: 0.8rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .search-result-name {
            font-weight: 500;
            color: #fff;
        }

        .search-result-ticker {
            font-size: 0.8rem;
            color: var(--accent-color);
            background: rgba(16, 185, 129, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .market-badge {
            font-size: 0.65rem;
            background: var(--accent-color);
            color: #111;
            padding: 0.15rem 0.3rem;
            border-radius: 3px;
            font-weight: 700;
        }

        /* AI Panel Markdown Styling */
        .ai-markdown {
            color: var(--text-main);
            font-size: 1.05rem;
        }

        .ai-markdown h3 {
            font-size: 1.3rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .ai-markdown h3:first-child {
            margin-top: 0;
        }

        .ai-markdown p {
            margin-bottom: 1.2rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.85);
        }

        .ai-markdown strong {
            color: #fff;
            background: rgba(16, 185, 129, 0.15); /* Subtle glowing green background */
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-weight: 700;
            border-bottom: 1px solid var(--accent-color);
        }
        
        .ai-markdown em {
            color: var(--secondary-glow);
            font-style: normal;
            font-weight: 500;
        }

        .ai-markdown ul, .ai-markdown ol {
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .ai-markdown li {
            margin-bottom: 0.6rem;
            line-height: 1.6;
        }
        
        .ai-markdown li::marker {
            color: var(--accent-color);
        }

        .ai-markdown blockquote {
            border-left: 4px solid var(--accent-color);
            margin: 1.5rem 0;
            background: rgba(16, 185, 129, 0.05);
            padding: 1rem 1.2rem;
            border-radius: 0 8px 8px 0;
            color: var(--text-main);
            font-style: italic;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel-overview {
            animation-delay: 0.1s;
        }

        .panel-watchlist {
            animation-delay: 0.2s;
        }

        .panel-ai-insight {
            animation-delay: 0.3s;
        }

        /* Screenshot Import Button */
        .btn-import {
            background: transparent;
            border: 1px solid #8b5cf6;
            color: #8b5cf6;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-import:hover {
            background: rgba(139, 92, 246, 0.1);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }

        /* Import Modal Overlay */
        .import-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .import-modal-overlay.active {
            display: flex;
        }

        .import-modal {
            background: #111;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.5rem;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            animation: fadeInUp 0.3s ease-out;
        }

        .import-modal h3 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .import-modal h3 i {
            color: #8b5cf6;
        }

        .import-upload-area {
            border: 2px dashed rgba(139, 92, 246, 0.4);
            border-radius: 16px;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .import-upload-area:hover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.05);
        }

        .import-upload-area.dragover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
        }

        .import-upload-area i {
            font-size: 2.5rem;
            color: #8b5cf6;
            margin-bottom: 0.75rem;
        }

        .import-upload-area p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .import-preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            margin-bottom: 1rem;
            border: 1px solid var(--card-border);
        }

        .import-stock-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .import-stock-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .import-stock-item input[type="checkbox"] {
            accent-color: #8b5cf6;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .import-stock-detail {
            flex: 1;
        }

        .import-stock-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .import-stock-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }

        .import-stock-shares {
            font-weight: 700;
            color: var(--accent-color);
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .import-mode-selector {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .import-mode-btn {
            flex: 1;
            padding: 0.6rem;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .import-mode-btn.selected {
            border-color: #8b5cf6;
            color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
        }

        .import-actions {
            display: flex;
            gap: 0.5rem;
        }

        .import-actions button {
            flex: 1;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .btn-import-confirm {
            background: linear-gradient(90deg, #8b5cf6, #a78bfa);
            color: #fff;
        }

        .btn-import-confirm:hover {
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .btn-import-confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-import-cancel {
            background: transparent;
            border: 1px solid var(--text-muted) !important;
            color: var(--text-muted);
        }

        .import-loading {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
        }

        .import-loading i {
            font-size: 2rem;
            color: #8b5cf6;
            margin-bottom: 0.75rem;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .panel-overview,
            .panel-watchlist,
            .panel-ai-insight {
                grid-column: span 1;
            }

            .market-indices {
                flex-direction: column;
            }

            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>

<body>
    <!-- Ambient glowing backgrounds matching the Portal -->
    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>
    <div class="ambient-glow-3"></div>

    <div class="container">
        <header>
            <div class="header-content" style="justify-content: center;">
                <div class="title-group" style="text-align: center;">
                    <h1>Stock Analyzer</h1>
                </div>
            </div>
        </header>

        <!-- Dynamic Dashboard Grid -->
        <main class="grid dashboard">
            <!-- Market Overview Card -->
            <div class="card panel-overview">
                <div class="status-dot"></div>
                <h2><i class="fa-solid fa-earth-americas"></i> Market Overview</h2>
                <div class="market-indices" id="market-indices-container">
                    <div style="color: var(--text-muted); text-align: center; width: 100%;">Loading market data...</div>
                    <!-- Dynamically populated by JS -->
                </div>
            </div>

            <!-- Portfolio Watchlist Card -->
            <div class="card panel-watchlist">
                <div class="watchlist-header">
                    <div style="display:flex; flex-direction:column; gap:0.25rem;">
                        <h2><i class="fa-solid fa-chart-pie"></i> My Portfolio</h2>
                        <div id="portfolio-totals"
                            style="font-size: 0.95rem; color: var(--accent-color); font-weight: 500;">
                            <!-- dynamically filled -->
                        </div>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn-import" id="btn-open-import"><i class="fa-solid fa-camera"></i> Import</button>
                        <button class="btn-add" id="btn-toggle-add"><i class="fa-solid fa-plus"></i> Add</button>
                    </div>
                </div>

                <div class="add-form-container" id="add-form" style="flex-direction: column;">
                    <div style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%;">
                        <input type="text" id="input-search" placeholder="Search company (e.g., 테슬라, Apple)..."
                            autocomplete="off" style="width: 100%; font-size: 1rem; padding: 0.75rem;">
                        <div style="display: flex; gap: 0.5rem; width: 100%;">
                            <button id="btn-search-stock" style="flex: 1; padding: 0.75rem;"><i
                                    class="fa-solid fa-magnifying-glass"></i> Search</button>
                            <button class="btn-cancel" id="btn-cancel-add"
                                style="flex: 1; padding: 0.75rem;">Cancel</button>
                        </div>
                    </div>
                    <div class="search-results" id="search-results-container">
                        <!-- Search results will appear here -->
                    </div>
                </div>

                <div class="stock-list" id="watchlist-container">
                    <!-- Dynamically populated by JS -->
                    <div style="color: var(--text-muted); text-align: center; padding: 1rem;">Loading portfolio data...
                    </div>
                </div>
            </div>

            <!-- AI News & Insight Card (Wide) -->
            <div class="card panel-ai-insight">
                <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Portfolio Analysis</h2>
                <div id="portfolio-analysis-container">
                    <div style="color: var(--text-muted); text-align: center; padding: 2rem;">
                        <i class="fa-solid fa-spinner fa-spin"
                            style="font-size: 2rem; margin-bottom: 1rem; color: var(--accent-color);"></i>
                        <br>AI is analyzing your portfolio...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Screenshot Import Modal -->
    <div class="import-modal-overlay" id="import-modal-overlay">
        <div class="import-modal">
            <h3><i class="fa-solid fa-camera"></i> 삼성증권 스크린샷 가져오기</h3>

            <!-- Step 1: Upload -->
            <div id="import-step-upload">
                <div class="import-upload-area" id="import-drop-zone">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <div style="font-weight: 500; font-size: 1.05rem;">스크린샷을 선택하세요</div>
                    <p>삼성증권 앱의 보유종목 화면을 캡처한 이미지</p>
                    <p style="font-size: 0.8rem; margin-top: 0.25rem; color: rgba(255,255,255,0.3);">JPG, PNG (최대 16MB)</p>
                </div>
                <input type="file" id="import-file-input" accept="image/*" style="display: none;">
                <div class="import-actions">
                    <button class="btn-import-cancel" id="btn-import-close">닫기</button>
                </div>
            </div>

            <!-- Step 2: Loading -->
            <div id="import-step-loading" style="display: none;">
                <div class="import-loading">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <div style="font-weight: 500; margin-top: 0.5rem;">AI가 스크린샷을 분석하고 있습니다...</div>
                    <p style="font-size: 0.85rem; margin-top: 0.25rem;">종목명, 코드, 보유수량을 추출 중</p>
                </div>
            </div>

            <!-- Step 3: Results -->
            <div id="import-step-results" style="display: none;">
                <img id="import-preview" class="import-preview-img" style="display: none;">
                <div id="import-result-count" style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.75rem;"></div>
                <div class="import-stock-list" id="import-stock-list">
                    <!-- Dynamically populated -->
                </div>
                <div class="import-mode-selector">
                    <button class="import-mode-btn selected" data-mode="replace" id="mode-replace">
                        <i class="fa-solid fa-arrows-rotate"></i> 전체 교체
                    </button>
                    <button class="import-mode-btn" data-mode="merge" id="mode-merge">
                        <i class="fa-solid fa-code-merge"></i> 기존에 합치기
                    </button>
                </div>
                <div class="import-actions">
                    <button class="btn-import-cancel" id="btn-import-retry">다시 촬영</button>
                    <button class="btn-import-confirm" id="btn-import-confirm">
                        <i class="fa-solid fa-check"></i> 가져오기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatNumberWithDot(num) {
            if (num === "N/A" || num === "Error") return num;
            let parts = num.toString().split(".");
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            return parts.join(".");
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('StockMaster UI Loaded');

            // Add gentle 3D hover effects to cards matching the Portal style
            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const rotateX = ((y - centerY) / centerY) * -3;
                    const rotateY = ((x - centerX) / centerX) * 3;

                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.01)`;
                    card.style.transition = 'none'; // remove transition for smooth tracking
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
                    card.style.transition = 'all 0.4s ease'; // restore transition when leaving
                });
            });

            // Polling data functionality
            async function fetchMarketData() {
                try {
                    const res = await fetch(`/api/market-indices?t=${new Date().getTime()}`);
                    const data = await res.json();

                    const container = document.getElementById('market-indices-container');
                    container.innerHTML = ''; // clear

                    data.forEach(item => {
                        const isUpStr = item.is_up ? 'positive' : 'negative';
                        const signStr = item.is_up ? '+' : '';
                        const iconStr = item.is_up ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down';
                        const changeStr = item.price === "N/A" || item.price === "Error" ? 'N/A' : `${signStr}${item.change}% <i class="fa-solid ${iconStr}"></i>`;
                        const priceStr = item.price === "N/A" || item.price === "Error" ? item.price : `${formatNumberWithDot(item.price)}`;

                        container.innerHTML += `
                            <div class="stock-row" style="padding: 0.4rem 0.6rem;">
                                <div class="stock-info" style="flex: 1;">
                                    <span class="stock-ticker" style="color: var(--text-main); font-size: 1rem;">${item.name}</span>
                                </div>
                                <div style="display: flex; align-items: center;">
                                    <div class="stock-numbers ${isUpStr}" style="flex-direction: row; gap: 0.75rem; align-items: center;">
                                        <span class="price" style="font-size: 1rem;">${priceStr}</span>
                                        <span class="change" style="font-size: 1rem;">${changeStr}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } catch (e) {
                    console.error("Failed to fetch market data", e);
                }
            }

            async function fetchWatchlistData() {
                try {
                    const res = await fetch(`/api/watchlist?t=${new Date().getTime()}`);
                    const data = await res.json();

                    const container = document.getElementById('watchlist-container');
                    container.innerHTML = ''; // clear

                    let totalKrw = 0;
                    let totalUsd = 0;

                    data.forEach(item => {
                        const isUpStr = item.is_up ? 'positive' : 'negative';
                        const signStr = item.is_up ? '+' : '';
                        const iconStr = item.is_up ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down';
                        const changeStr = item.price === "N/A" || item.price === "Error" ? 'N/A' : `${signStr}${item.change}% <i class="fa-solid ${iconStr}"></i>`;
                        const priceStr = item.price === "N/A" || item.price === "Error" ? item.price : `${item.currency}${formatNumberWithDot(item.price)}`;

                        const shares = item.shares || 0;
                        const totalValStr = shares > 0 && item.total_value ? `<div style="font-size:0.85rem; color:var(--accent-color); margin-top:0.15rem;">보유: ${formatNumberWithDot(shares)}주 (${item.currency}${formatNumberWithDot(item.total_value)})</div>` : '';

                        if (item.currency === '₩' && item.total_value) totalKrw += item.total_value;
                        else if (item.currency === '$' && item.total_value) totalUsd += item.total_value;

                        container.innerHTML += `
                            <div class="stock-row">
                                <div class="stock-info">
                                    <span class="stock-ticker">${item.name}</span>
                                    ${totalValStr}
                                </div>
                                <div style="display: flex; align-items: center;">
                                    <div class="stock-numbers ${isUpStr}">
                                        <span class="price">${priceStr}</span>
                                        <span class="change">${changeStr}</span>
                                    </div>
                                    <button class="btn-edit" onclick="editStockShares('${item.raw_ticker}', '${item.name}', ${shares})" title="Edit Shares"><i class="fa-solid fa-pen"></i></button>
                                    <button class="btn-remove" onclick="removeStock('${item.raw_ticker}')" title="Remove"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    });

                    document.getElementById('portfolio-totals').innerHTML = `총 자산: ₩${formatNumberWithDot(totalKrw)} + $${formatNumberWithDot(totalUsd)}`;
                } catch (e) {
                    console.error("Failed to fetch watchlist data", e);
                }
            }

            async function fetchPortfolioAnalysis() {
                try {
                    const container = document.getElementById('portfolio-analysis-container');

                    const res = await fetch(`/api/portfolio-analysis?t=${new Date().getTime()}`);
                    const data = await res.json();

                    if (data.success) {
                        let rawText = data.analysis;
                        // Pre-process section headers to markdown h3
                        rawText = rawText.replace(/\[Current Portfolio Status\]/gi, '### 📊 Current Portfolio Status');
                        rawText = rawText.replace(/\[Market News & Portfolio Direction\]/gi, '### 🌍 Market News & Portfolio Direction');
                        rawText = rawText.replace(/\[Recommended Modifications\]/gi, '### 💡 Recommended Modifications');
                        
                        let htmlContent = rawText;
                        if (typeof marked !== 'undefined') {
                            htmlContent = marked.parse(rawText);
                        } else {
                            // Fallback just in case marked is not loaded
                            htmlContent = rawText.replace(/\n/g, '<br>');
                        }

                        container.innerHTML = `
                            <div class="ai-markdown">${htmlContent}</div>
                        `;
                    } else if (data.error) {
                        container.innerHTML = `
                            <p style="color: var(--negative-color);">Error: ${data.error}</p>
                        `;
                    }
                } catch (e) {
                    console.error("Failed to fetch portfolio analysis", e);
                }
            }

            // Initialization and setup interval
            fetchMarketData();
            fetchWatchlistData();
            fetchPortfolioAnalysis();
            setInterval(() => {
                fetchMarketData();
                fetchWatchlistData();
                fetchPortfolioAnalysis();
            }, 300000); // 5 minute refresh period

            // Watchlist Add/Remove interactions
            const addForm = document.getElementById('add-form');
            const searchInput = document.getElementById('input-search');
            const searchBtn = document.getElementById('btn-search-stock');
            const searchResultsContainer = document.getElementById('search-results-container');

            document.getElementById('btn-toggle-add').addEventListener('click', () => {
                addForm.classList.toggle('active');
                if (addForm.classList.contains('active')) {
                    searchInput.focus();
                }
            });

            document.getElementById('btn-cancel-add').addEventListener('click', () => {
                addForm.classList.remove('active');
                searchInput.value = '';
                searchResultsContainer.classList.remove('active');
                searchResultsContainer.innerHTML = '';
            });

            searchBtn.addEventListener('click', async () => {
                const query = searchInput.value;
                if (!query) {
                    alert('Please enter a search term.');
                    return;
                }

                searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                searchBtn.disabled = true;
                searchResultsContainer.classList.add('active');
                searchResultsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--text-muted);">Searching with AI...</div>';

                try {
                    const res = await fetch('/api/search-stock', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query })
                    });
                    const data = await res.json();

                    searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Search';
                    searchBtn.disabled = false;

                    if (data.success && data.results.length > 0) {
                        searchResultsContainer.innerHTML = '';
                        data.results.forEach(stock => {
                            const item = document.createElement('div');
                            item.className = 'search-result-item';
                            const marketStr = stock.market ? `<span class="market-badge">${stock.market}</span>` : '';
                            item.innerHTML = `
                                <span class="search-result-name">${stock.name}</span>
                                <span class="search-result-ticker">${marketStr} ${stock.ticker}</span>
                            `;
                            item.addEventListener('click', () => {
                                addStockToWatchlist(stock.ticker, stock.name);
                            });
                            searchResultsContainer.appendChild(item);
                        });
                    } else if (data.success && data.results.length === 0) {
                        searchResultsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--text-muted);">No results found.</div>';
                    } else {
                        searchResultsContainer.innerHTML = `<div style="padding: 1rem; text-align: center; color: var(--negative-color);">Error: ${data.error}</div>`;
                    }
                } catch (e) {
                    console.error("Search API failed", e);
                    searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Search';
                    searchBtn.disabled = false;
                    searchResultsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--negative-color);">Network error occurred.</div>';
                }
            });

            // Allow Enter key to trigger search
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchBtn.click();
                }
            });

            async function addStockToWatchlist(ticker, name) {
                const sharesStr = prompt('Enter quantity:', "1");
                if (sharesStr === null) return;
                const shares = parseFloat(sharesStr) || 1;

                try {
                    searchResultsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--text-muted);">Adding to portfolio...</div>';
                    const res = await fetch('/api/watchlist', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ticker, name, shares })
                    });
                    const data = await res.json();
                    if (data.success) {
                        addForm.classList.remove('active');
                        searchInput.value = '';
                        searchResultsContainer.classList.remove('active');
                        searchResultsContainer.innerHTML = '';

                        document.getElementById('watchlist-container').innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 1rem;">Updating...</div>';
                        fetchWatchlistData();
                        fetchPortfolioAnalysis(); // Re-analyze on new stock added
                    } else {
                        alert('Error: ' + data.error);
                        searchResultsContainer.innerHTML = '';
                    }
                } catch (e) {
                    console.error("Failed to add stock", e);
                    alert("Failed to add stock.");
                }
            }

            window.editStockShares = async function (rawTicker, name, currentShares) {
                const sharesStr = prompt('Enter quantity:', currentShares);
                if (sharesStr === null) return;
                const shares = parseFloat(sharesStr) || 0;

                try {
                    document.getElementById('watchlist-container').innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 1rem;">Updating...</div>';
                    const res = await fetch('/api/watchlist', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ticker: rawTicker, name: name, shares: shares })
                    });
                    const data = await res.json();
                    if (data.success) {
                        fetchWatchlistData();
                        fetchPortfolioAnalysis();
                    } else {
                        alert('Error: ' + data.error);
                        fetchWatchlistData();
                    }
                } catch (e) {
                    console.error("Failed to update stock", e);
                    alert("Failed to update stock.");
                    fetchWatchlistData();
                }
            };

            window.removeStock = async function (rawTicker) {
                if (!confirm("Are you sure you want to remove this stock?")) return;

                try {
                    const res = await fetch(`/api/watchlist/${rawTicker}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) {
                        document.getElementById('watchlist-container').innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 1rem;">Updating...</div>';
                        fetchWatchlistData();
                        fetchPortfolioAnalysis(); // Re-analyze after removal
                    }
                } catch (e) {
                    console.error("Failed to remove stock", e);
                }
            };

            // ====== Screenshot Import Logic ======
            const importOverlay = document.getElementById('import-modal-overlay');
            const importFileInput = document.getElementById('import-file-input');
            const importDropZone = document.getElementById('import-drop-zone');
            const stepUpload = document.getElementById('import-step-upload');
            const stepLoading = document.getElementById('import-step-loading');
            const stepResults = document.getElementById('import-step-results');

            let parsedStocks = [];
            let importMode = 'replace';

            // Open modal
            document.getElementById('btn-open-import').addEventListener('click', () => {
                importOverlay.classList.add('active');
                resetImportModal();
            });

            // Close modal
            document.getElementById('btn-import-close').addEventListener('click', () => {
                importOverlay.classList.remove('active');
            });

            importOverlay.addEventListener('click', (e) => {
                if (e.target === importOverlay) importOverlay.classList.remove('active');
            });

            // Click drop zone → open file picker
            importDropZone.addEventListener('click', () => importFileInput.click());

            // Drag & drop
            importDropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                importDropZone.classList.add('dragover');
            });
            importDropZone.addEventListener('dragleave', () => importDropZone.classList.remove('dragover'));
            importDropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                importDropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleImportFile(e.dataTransfer.files[0]);
                }
            });

            // File selected
            importFileInput.addEventListener('change', () => {
                if (importFileInput.files.length > 0) {
                    handleImportFile(importFileInput.files[0]);
                }
            });

            function resetImportModal() {
                stepUpload.style.display = '';
                stepLoading.style.display = 'none';
                stepResults.style.display = 'none';
                importFileInput.value = '';
                parsedStocks = [];
                importMode = 'replace';
                document.getElementById('mode-replace').classList.add('selected');
                document.getElementById('mode-merge').classList.remove('selected');
            }

            async function handleImportFile(file) {
                if (!file.type.startsWith('image/')) {
                    alert('이미지 파일만 업로드할 수 있습니다.');
                    return;
                }
                if (file.size > 16 * 1024 * 1024) {
                    alert('파일 크기가 16MB를 초과합니다.');
                    return;
                }

                // Show loading
                stepUpload.style.display = 'none';
                stepLoading.style.display = '';

                // Show preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    const preview = document.getElementById('import-preview');
                    preview.src = e.target.result;
                    preview.style.display = '';
                };
                reader.readAsDataURL(file);

                // Send to API
                const formData = new FormData();
                formData.append('image', file);

                try {
                    const res = await fetch('/api/parse-screenshot', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();

                    stepLoading.style.display = 'none';

                    if (data.success && data.stocks.length > 0) {
                        parsedStocks = data.stocks;
                        renderImportResults();
                        stepResults.style.display = '';
                    } else {
                        alert(data.error || '종목 정보를 찾을 수 없습니다. 삼성증권 보유종목 화면을 캡처해주세요.');
                        resetImportModal();
                    }
                } catch (e) {
                    console.error('Screenshot parse failed', e);
                    alert('스크린샷 분석 중 오류가 발생했습니다.');
                    stepLoading.style.display = 'none';
                    resetImportModal();
                }
            }

            function renderImportResults() {
                const list = document.getElementById('import-stock-list');
                const countEl = document.getElementById('import-result-count');
                countEl.textContent = `${parsedStocks.length}개 종목이 감지되었습니다.`;

                list.innerHTML = '';
                parsedStocks.forEach((stock, idx) => {
                    const marketBadge = stock.market === 'US'
                        ? '<span style="font-size:0.65rem; background:#3b82f6; color:#fff; padding:0.1rem 0.3rem; border-radius:3px; font-weight:700;">US</span>'
                        : `<span style="font-size:0.65rem; background:var(--accent-color); color:#111; padding:0.1rem 0.3rem; border-radius:3px; font-weight:700;">${stock.market}</span>`;

                    list.innerHTML += `
                        <div class="import-stock-item">
                            <input type="checkbox" checked data-idx="${idx}" class="import-checkbox">
                            <div class="import-stock-detail">
                                <div class="import-stock-name">${stock.name}</div>
                                <div class="import-stock-meta">${marketBadge} ${stock.code}</div>
                            </div>
                            <div class="import-stock-shares">${stock.shares}주</div>
                        </div>
                    `;
                });
            }

            // Mode selector
            document.getElementById('mode-replace').addEventListener('click', function () {
                importMode = 'replace';
                this.classList.add('selected');
                document.getElementById('mode-merge').classList.remove('selected');
            });
            document.getElementById('mode-merge').addEventListener('click', function () {
                importMode = 'merge';
                this.classList.add('selected');
                document.getElementById('mode-replace').classList.remove('selected');
            });

            // Retry button
            document.getElementById('btn-import-retry').addEventListener('click', () => {
                resetImportModal();
            });

            // Confirm import
            document.getElementById('btn-import-confirm').addEventListener('click', async () => {
                const checkboxes = document.querySelectorAll('.import-checkbox');
                const selectedStocks = [];
                checkboxes.forEach(cb => {
                    if (cb.checked) {
                        selectedStocks.push(parsedStocks[parseInt(cb.dataset.idx)]);
                    }
                });

                if (selectedStocks.length === 0) {
                    alert('가져올 종목을 선택해주세요.');
                    return;
                }

                const confirmBtn = document.getElementById('btn-import-confirm');
                confirmBtn.disabled = true;
                confirmBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 처리 중...';

                try {
                    const res = await fetch('/api/import-portfolio', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ stocks: selectedStocks, mode: importMode })
                    });
                    const data = await res.json();

                    if (data.success) {
                        importOverlay.classList.remove('active');
                        document.getElementById('watchlist-container').innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 1rem;">Updating...</div>';
                        fetchWatchlistData();
                        fetchPortfolioAnalysis();
                    } else {
                        alert('가져오기 실패: ' + (data.error || '알 수 없는 오류'));
                    }
                } catch (e) {
                    console.error('Import failed', e);
                    alert('가져오기 중 오류가 발생했습니다.');
                } finally {
                    confirmBtn.disabled = false;
                    confirmBtn.innerHTML = '<i class="fa-solid fa-check"></i> 가져오기';
                }
            });
        });

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then((registration) => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, (err) => {
                    console.error('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>

</html>
