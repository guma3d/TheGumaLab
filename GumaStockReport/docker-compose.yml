version: '3.8'

services:
  gumastockreport:
    build: .
    container_name: gumastockreport_app
    restart: unless-stopped
    ports:
      - "8050:8050"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - .:/app

  gumastockreport_redis:
    image: redis:alpine
    container_name: gumastockreport_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
