<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GumaKidsPython</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>GumaKidsPython</h1>
        <p>파이썬 게임 업그레이드 모험</p>
      </div>
      <div class="save-panel">
        <label for="profileInput">프로필</label>
        <input id="profileInput" value="default" maxlength="40" autocomplete="off">
        <button id="loadSaveBtn" type="button">불러오기</button>
        <button id="saveBtn" type="button">서버 저장</button>
      </div>
    </header>

    <main class="app-shell">
      <nav class="season-tabs" aria-label="시즌 선택">
        <button class="active" data-season="season_01" type="button">시즌 1</button>
        <button data-season="season_02" type="button">시즌 2</button>
        <button data-season="season_03" type="button">시즌 3</button>
        <button data-season="season_04" type="button">시즌 4</button>
      </nav>
      <nav id="chapterTabs" class="chapter-tabs" aria-label="챕터 선택"></nav>

      <section class="ide-layout">
        <aside class="file-panel">
          <div class="file-panel-head">
            <p class="eyebrow">파일트리</p>
            <h2>project</h2>
          </div>
          <div id="fileTree" class="file-tree"></div>
        </aside>

        <aside class="code-panel">
          <div class="code-panel-head">
            <div>
              <p class="eyebrow">코드 내용</p>
              <h2 id="activeFileLabel">upgrade_zone.py</h2>
            </div>
            <button id="applyUpgradeBtn" class="primary" type="button">업그레이드 적용</button>
          </div>
          <textarea id="codeEditor" class="code-editor" spellcheck="false" aria-label="업그레이드 코드 편집"></textarea>
          <section class="parsed-panel">
            <p class="eyebrow">적용된 파라미터</p>
            <div id="parsedParams" class="parsed-params"></div>
          </section>
        </aside>

        <section class="right-stack">
          <section class="lesson-panel">
            <p class="eyebrow" id="chapterLabel">챕터 1~12</p>
            <h2 id="seasonTitle">보물 점수 게임</h2>
            <div id="lessonBody" class="lesson-body"></div>
            <div class="lesson-controls">
              <button id="prevLessonBtn" type="button">이전</button>
              <span id="lessonPageLabel">1 / 5</span>
              <button id="nextLessonBtn" type="button">다음</button>
            </div>
            <p id="saveStatus" class="status">서버 저장을 사용할 수 있습니다.</p>
          </section>

          <section class="play-panel">
            <div class="hud">
              <strong id="hudTitle">번개용사 등장!</strong>
              <span id="hudStats">점수 10 · 체력 100</span>
            </div>

            <div id="gameMount" class="game-mount"></div>

            <div class="controls">
              <button id="startGameBtn" class="primary" type="button">게임 시작</button>
              <button id="actionBtn" type="button">액션</button>
              <button id="resetBtn" type="button">다시 시작</button>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
