# 공통 프록시 설정 (타임아웃 및 업로드 용량)
proxy_read_timeout 600s;
proxy_connect_timeout 600s;
proxy_send_timeout 600s;
client_max_body_size 500M;

# 1. 홈서버 메인 대시보드 및 보안 사령탑 (home.guma3d.com)
server {
    listen 80;
    server_name home.guma3d.com localhost _;

    location = /gumaddanjit { return 302 /gumaddanjit/; }
    location /gumaddanjit/ {
        proxy_pass http://host.docker.internal:8089/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /gumatts { return 302 /gumatts/; }
    location /gumatts/ {
        proxy_pass http://host.docker.internal:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /gumatts;
    }

    location = /gumastory { return 308 /gumaddanjit/story/$is_args$args; }

    location /gumastory/ { rewrite ^/gumastory/(.*)$ /gumaddanjit/story/$1 permanent; }

    # GumaShop uses the existing SSO gateway; the app enforces login as well.
    location = /gumashop { return 308 /gumaddanjit/shop/$is_args$args; }

    location /gumashop/ { rewrite ^/gumashop/(.*)$ /gumaddanjit/shop/$1 permanent; }

    location / {
        proxy_pass http://host.docker.internal:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. ServerStatus (gumaserverstatus.guma3d.com)
server {
    listen 80;
    server_name gumaserverstatus.guma3d.com;

    auth_request /auth;
    error_page 401 = @error401;

    location = /auth {
        internal;
        proxy_pass http://host.docker.internal:8081/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @error401 {
        return 302 https://home.guma3d.com/login?redirect_url=https://$host$request_uri;
    }

    location / {
        proxy_pass http://host.docker.internal:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. GumaTube (gumatube.guma3d.com)
server {
    listen 80;
    server_name gumatube.guma3d.com;

    auth_request /auth;
    error_page 401 = @error401;

    location = /auth {
        internal;
        proxy_pass http://host.docker.internal:8081/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @error401 {
        return 302 https://home.guma3d.com/login?redirect_url=https://$host$request_uri;
    }

    location / {
        proxy_pass http://host.docker.internal:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Retired service URLs preserve bookmarks and public product links.
server {
    listen 80;
    server_name videofactory.guma3d.com;
    location = /GumaDdanjit { return 308 https://home.guma3d.com/gumaddanjit/shorts/products$is_args$args; }
    location = /products { return 308 https://home.guma3d.com/gumaddanjit/shorts/products$is_args$args; }
    location / { return 308 https://home.guma3d.com/gumaddanjit/shorts$request_uri; }
}
server {
    listen 80;
    server_name gumastory.guma3d.com;
    location / { return 308 https://home.guma3d.com/gumaddanjit/story$request_uri; }
}
server {
    listen 80;
    server_name gumashop.guma3d.com;
    location / { return 308 https://home.guma3d.com/gumaddanjit/shop$request_uri; }
}
