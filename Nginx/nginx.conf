# 공통 프록시 설정 (타임아웃 및 업로드 용량)
proxy_read_timeout 600s;
proxy_connect_timeout 600s;
proxy_send_timeout 600s;
client_max_body_size 500M;

# 1. 홈서버 메인 대시보드 및 보안 사령탑 (home.guma3d.com)
server {
    listen 80;
    server_name home.guma3d.com localhost _;

    location / {
        proxy_pass http://host.docker.internal:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. GumaPhoto (gumaphoto.guma3d.com)
server {
    listen 80;
    server_name gumaphoto.guma3d.com;

    auth_request /auth;
    error_page 401 = @error401;

    location = /auth {
        internal;
        proxy_pass http://host.docker.internal:8081/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @error401 {
        return 302 https://home.guma3d.com/login?redirect_url=https://$host$request_uri;
    }

    location / {
        proxy_pass http://host.docker.internal:8085/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

