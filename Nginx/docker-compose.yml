services:
  nginx:
    image: nginx:latest
    container_name: HomeServer_Nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: HomeServer_Cloudflared
    command: tunnel --no-autoupdate run
    env_file:
      - ../.env
    restart: unless-stopped
