version: '3.8'

services:
  videofactory:
    build: .
    container_name: GumaVideoFactory_app
    ports:
      - "8085:8085"
    volumes:
      - .:/app
      - ./storage:/app/storage
      - ../GumaTTS/client.py:/opt/gumatts/client.py:ro
      - ../GumaTTS/storage/service-token:/run/secrets/gumatts_token:ro
    environment:
      GUMATTS_URL: http://host.docker.internal:8088
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    restart: unless-stopped
