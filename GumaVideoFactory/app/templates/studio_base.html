<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GumaVideoFactory</title>
<style>
:root{color-scheme:dark;--bg:#080d10;--panel:#111a20;--line:#26343c;--text:#edf5f7;--muted:#97aab4;--accent:#37deb4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#14302b 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,sans-serif}a{color:var(--accent);text-decoration:none}button,input,select,textarea{font:inherit}button,.button{border:1px solid var(--line);background:#1b2b34;color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer;display:inline-block;text-align:center}button:hover,.button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--accent);color:#08271e;font-weight:700;border-color:transparent}input,select,textarea{background:#091217;color:var(--text);border:1px solid var(--line);padding:10px;border-radius:8px;max-width:100%;min-width:0}textarea{resize:vertical;width:100%}input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;flex-shrink:0}main{max-width:1120px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 24px;border-bottom:1px solid var(--line);margin-bottom:24px}.brand{font-size:clamp(20px,4.6vw,30px);font-weight:800;color:var(--text);letter-spacing:-1px;white-space:nowrap}.brand b{color:var(--accent)}h1{font-size:clamp(23px,4vw,32px);line-height:1.25;margin:12px 0}h2{font-size:20px;margin:0 0 14px}h3{font-size:18px;margin:8px 0}p{margin:8px 0}.muted,small{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:1.5px;color:var(--accent);font-weight:700}.badge{display:inline-block;font-size:12px;background:#213139;border:1px solid var(--line);padding:3px 8px;border-radius:6px;white-space:nowrap}.tabs{display:flex;gap:8px;margin:18px 0;overflow-x:auto}.tabs a,.tabs button{white-space:nowrap}.active{background:var(--accent)!important;color:#08271e!important;font-weight:700}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}.panel{margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.steps{display:grid;gap:8px;margin-top:16px}.step{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px}.step button{white-space:nowrap;padding:10px 8px}.step button:first-child{font-size:14px}.title-line{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:55px;line-height:1.5}.hook{color:#bfd0d8;min-height:64px;font-size:14px}.divider{border-top:1px solid var(--line);margin:18px 0}.work-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}.work-row a{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.thumbs img,.scene img{width:100%;border-radius:10px;background:#080c10;object-fit:contain}.thumbs img{aspect-ratio:9/16}.references img{aspect-ratio:1}.scene{padding:14px}.scene img{aspect-ratio:9/16;max-height:380px}.check{display:flex;align-items:flex-start;gap:10px;margin:12px 0}.notice{border-left:3px solid var(--accent);padding:10px 14px;background:#152c29;margin:16px 0}.warn{border-color:#efb663;background:#30271b;color:#ffe0a8}.error{color:#ffb4b4}details{margin:10px 0}summary{cursor:pointer;color:var(--muted)}.hidden{display:none!important}.status{white-space:pre-wrap;overflow-wrap:anywhere}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:13px 18px;border-radius:12px;background:#e0fff4;color:#103529;z-index:5;max-width:90vw;box-shadow:0 4px 30px #0008}video{width:100%;max-height:650px;background:#000;border-radius:12px}.pager{display:flex;justify-content:center;gap:16px;margin:20px 0}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}li{margin:6px 0;overflow-wrap:anywhere}label{font-size:14px}@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:16px}header{padding-bottom:16px;margin-bottom:18px}.grid{grid-template-columns:1fr}.panel,.card{padding:16px}.title-line{min-height:0}.hook{min-height:0}.brand-sub{display:none}.row{gap:8px}h2{font-size:18px}.tabs button,.tabs a{padding:9px 12px}.step button:first-child{font-size:14px}.scene img{max-height:430px}.thumbs{gap:8px}}
.workflow-message{margin-top:16px;padding:10px 12px;background:#12332b;border:1px solid #23654f;border-radius:10px;font-size:13px}.workflow-message strong{display:block;margin-top:3px}.approved-mark{color:var(--accent);font-weight:700}.stage-caption{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);margin-bottom:4px}.stage-line{min-width:0}.work-row small{text-align:right;font-size:12px}
.stage-complete:disabled{opacity:1;color:#b9d4ca;background:#172923}.product-title{color:var(--text);text-decoration:underline;text-decoration-color:#486057;text-underline-offset:5px}.in-progress{position:relative;overflow:hidden;opacity:1!important}.in-progress>span:last-child{position:relative;z-index:1}.button-progress{position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff38,transparent);width:55%;animation:button-progress 1.6s linear infinite}.progress-note{display:block;font-size:12px;margin-top:4px;overflow-wrap:anywhere}@keyframes button-progress{from{transform:translateX(-110%)}to{transform:translateX(210%)}}@media(prefers-reduced-motion:reduce){.button-progress{animation:none;width:100%;background:#ffffff15}}dialog{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(900px,94vw);max-height:90dvh;padding:20px}dialog::backdrop{background:#000b}dialog .grid{margin:16px 0}dialog h2{margin:0}dialog img{max-height:240px}dialog textarea{min-height:100px}dialog .scene{min-width:0}
</style></head><body><main><header><a href="/" class="brand"><b>▰</b> GumaVideoFactory</a><span class="badge brand-sub">PRODUCT STUDIO</span></header>{% block content %}{% endblock %}</main><div id="toast" class="hidden" role="status"></div>
<script>
async function api(url,body,method='POST'){let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'입력 내용을 확인해주세요.');return data}
function toast(text){let el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),6000)}
function esc(text){const el=document.createElement('span');el.textContent=text??'';return el.innerHTML.replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function safeLink(value){try{let u=new URL(value,location.origin);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
</script>{% block scripts %}{% endblock %}</body></html>
