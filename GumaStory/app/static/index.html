<dialog id="asset-dialog" aria-labelledby="asset-heading"><button class="dialog-close" data-close="asset-dialog" aria-label="닫기">×</button><div id="asset-content"></div></dialog>
<dialog id="upload-dialog" aria-labelledby="upload-heading"><button class="dialog-close" data-close="upload-dialog" aria-label="닫기">×</button><h2 id="upload-heading">리소스 보관하기</h2><p class="muted">원본을 보존하고, 수정본은 별도 버전으로 추가합니다.</p><form id="upload-form"><label>제목<input name="title" required maxlength="160"></label><label>캐릭터<select name="character_id" id="upload-character"></select></label><label>분류<select name="kind"><option value="other">기타 자료</option><option value="angle">각도</option><option value="expression">표정</option><option value="scene">상황</option><option value="audio">음성</option><option value="video">영상</option></select></label><label>원본 리소스 ID (수정본일 때만)<input name="parent_id" maxlength="120" placeholder="원본 상세 화면에서 ID 확인"></label><label class="file-drop">파일 선택<input type="file" name="file" required accept=".png,.jpg,.jpeg,.webp,.mp3,.wav,.mp4"></label><p class="muted">PNG · JPG · WebP · MP3 · WAV · MP4 / 최대 250MB</p><button class="primary" type="submit">원본 보관</button><p id="upload-error" role="alert"></p></form></dialog>
<div id="toast" role="status" hidden></div>
