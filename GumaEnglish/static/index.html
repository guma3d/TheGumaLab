<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>GumaEnglish</title>
  <link rel="stylesheet" href="/css/style.css?v=4" />
</head>
<body>
  <div id="fatal-error" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#ff6b9d;color:#0d1020;padding:12px 16px;font:14px system-ui;white-space:pre-wrap;word-break:break-all;"></div>
  <script>
    // 예외 시에만 표시되는 최후 수단 에러 배너. 평소엔 숨김.
    (function() {
      function showErr(msg) {
        var el = document.getElementById('fatal-error');
        if (!el) return;
        el.style.display = 'block';
        el.textContent = (el.textContent ? el.textContent + '\n' : '') + msg;
      }
      window.addEventListener('error', function(e) {
        showErr('[JS error] ' + (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
      });
      window.addEventListener('unhandledrejection', function(e) {
        showErr('[Promise rejection] ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
      });
    })();
  </script>
  <main id="app">
    <header>
      <div class="stage-badge">Stage <span id="stage-num">1</span></div>
      <div class="robot-name" id="robot-name">Scout</div>
    </header>

    <section id="pattern-card">
      <div class="label">오늘의 패턴</div>
      <div class="pattern-en" id="pattern-en">…</div>
      <div class="pattern-ko" id="pattern-ko">…</div>
    </section>

    <section id="practice" hidden>
      <div class="round-info">
        <span id="round-label">라운드 1 / 12</span>
        <span id="phase-label" class="phase-pill">1단계 · 보고 듣고 따라 말하기</span>
      </div>

      <div class="sentence-card">
        <div class="sentence-en" id="sentence-en">…</div>
        <div class="sentence-ko" id="sentence-ko">…</div>
        <button id="replay-btn" type="button" class="ghost-btn" hidden>🔊 다시 듣기</button>
      </div>

      <div class="transcript" id="transcript" hidden></div>
      <div class="feedback" id="feedback" hidden></div>
    </section>

    <div id="banner" class="banner" hidden></div>

    <section id="controls">
      <button id="start-btn" type="button">연습 시작</button>
      <button id="speak-btn" type="button" hidden>🎤 말하기</button>
      <button id="retry-btn" type="button" class="ghost-btn" hidden>다시 시도</button>
      <button id="skip-btn" type="button" class="ghost-btn" hidden>넘어가기</button>
      <button id="next-btn" type="button" hidden>다음 →</button>
      <button id="restart-btn" type="button" hidden>처음부터 다시</button>
    </section>

    <footer>
      <small>GumaEnglish · TheGumaLab</small>
    </footer>
  </main>

  <script type="module" src="/js/main.js?v=4"></script>
</body>
</html>
