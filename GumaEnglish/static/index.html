<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>GumaEnglish</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=7" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="ambient-glow-2"></div>
  <div id="fatal-error" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#ef4444;color:#fff;padding:12px 16px;font:14px system-ui;white-space:pre-wrap;word-break:break-all;"></div>
  <script>
    (function() {
      function showErr(msg) {
        var el = document.getElementById('fatal-error');
        if (!el) return;
        el.style.display = 'block';
        el.textContent = (el.textContent ? el.textContent + '\n' : '') + msg;
      }
      window.addEventListener('error', function(e) {
        showErr('[JS error] ' + (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
      });
      window.addEventListener('unhandledrejection', function(e) {
        showErr('[Promise rejection] ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
      });
    })();
  </script>

  <div class="container">
    <header class="top-header">
      <div class="logo">
        <i class="fa-solid fa-comments"></i>
        <span>Guma</span>English
      </div>
      <div class="stage-badge">Stage <span id="stage-num">1</span></div>
    </header>

    <section class="card pattern-card" id="pattern-card">
      <div class="card-label">TODAY'S PATTERN</div>
      <div class="robot-name" id="robot-name">Scout</div>
      <div class="pattern-en" id="pattern-en">...</div>
      <div class="pattern-ko" id="pattern-ko">...</div>
    </section>

    <section class="card practice-card" id="practice" hidden>
      <div class="round-info">
        <span id="round-label">1 / 12</span>
        <span id="phase-label" class="phase-pill">1</span>
      </div>

      <div class="sentence-card">
        <div class="sentence-en" id="sentence-en">...</div>
        <div class="sentence-ko" id="sentence-ko">...</div>
        <button id="replay-btn" type="button" class="ghost-btn" hidden><i class="fa-solid fa-volume-high"></i> Listen Again</button>
      </div>

      <div class="status-area">
        <div class="status-icon" id="status-icon"></div>
        <div class="status-text" id="feedback"></div>
      </div>

      <div class="transcript" id="transcript">&nbsp;</div>
    </section>

    <div id="banner" class="banner" hidden></div>

    <section id="controls">
      <button id="start-btn" type="button" class="btn-primary"><i class="fa-solid fa-play"></i> Learning Start</button>
    </section>

    <footer>
      <small>GumaEnglish &middot; TheGumaLab</small>
    </footer>
  </div>

  <script type="module" src="/js/main.js?v=7"></script>
</body>
</html>
